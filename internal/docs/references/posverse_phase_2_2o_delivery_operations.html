function returnCheckin(id,condition){if(!canDispatch())return err('Perlu manager/dispatcher.');const o=orderById(id);if(!allowedTenant(o)||o.delivery!=='RETURN_TO_STORE')return err('Belum masuk proses retur ke outlet.');if(!meta(o).returnHandedOffAt)return err('Kurir harus mengonfirmasi serah terima ke outlet terlebih dahulu.');if(!['QUARANTINE','SELLABLE','DAMAGED'].includes(condition))return err('Wajib klasifikasi barang retur.');const m=meta(o);m.returnCondition=condition;m.returnCheckedAt=now();o.delivery='RETURNED';o.status='RETURNED';audit(o,'RETURN_CHECKIN',`Kondisi ${condition}; tidak otomatis restock/refund`);render();toast('Barang diterima outlet, menunggu inventory/finance');return true;}
function podSubmit(id,data){if(!canCourier())return err('Hanya kurir pemilik tugas.');const o=orderById(id),c=me();if(!allowedTenant(o)||!c||o.courier!==c.id||o.delivery!=='ARRIVED')return err('Konfirmasi POD hanya setelah tiba di tujuan.');const m=meta(o);if((data.receiver||'').trim().length<3)return err('Nama penerima minimal 3 karakter.');if(!['otp','photo','signature'].includes(data.method))return err('Pilih metode bukti antar.');if(data.method==='otp'&&data.otp!==(m.demoOtp||'4826'))return err('OTP demo tidak sesuai.');if(data.method==='photo'&&!data.proofName)return err('Upload bukti foto simulasi (hanya nama file disimpan).');if(data.method==='signature'&&(data.signedName||'').trim().length<3)return err('Nama tanda tangan harus diisi.');
 if(isCOD(o)){const got=Number(data.codAmount);if(!Number.isSafeInteger(got)||got!==Math.round(Number(o.total)||0))return err(`COD wajib tepat ${money(o.total)} sebelum delivered.`);if(m.codCollected>0)return err('COD telah dikoleksi.');m.codCollected=got;o.payment='COD_COLLECTED';o.codRemitted=false;}
 m.pod={receiver:limitString(data.receiver,80),method:data.method,proofName:limitString(data.proofName||'',80),signedName:limitString(data.signedName||'',80),at:now(),attributedCourier:c.id};m.proofReview='PENDING';o.pod={...m.pod};o.delivery='DELIVERED';o.status='COMPLETED';audit(o,'DELIVERED',`POD ${data.method}; collected COD ${money(m.codCollected)}`);render();toast('Delivered dan POD terkirim untuk review');return true;
}
function proofReview(id,decision,reason){if(!canDispatch())return err('Akses dispatcher diperlukan.');const o=orderById(id);if(!allowedTenant(o)||o.delivery!=='DELIVERED'||meta(o).proofReview!=='PENDING')return err('POD tidak menunggu review.');if(!['APPROVED','FLAGGED'].includes(decision))return err('Pilihan review tidak sah.');if(decision==='FLAGGED'&&(!reason||reason.length<5))return err('Isi alasan flag minimal 5 karakter.');const m=meta(o);m.proofReview=decision;m.proofReason=limitString(reason||'',200);audit(o,'POD_'+decision,reason||'Review selesai');render();return true;}
function outstanding(id){const o=orderById(id);if(!allowedTenant(o)||!isCOD(o))return 0;const m=meta(o);const verified=O.remittances.filter(r=>r.tenant===ui.tenant&&r.orderId===id&&r.status==='VERIFIED').reduce((s,r)=>s+r.amount,0);return Math.max(0,(m.codCollected||0)-verified)}
function pendingCOD(id){return O.remittances.filter(r=>r.tenant===ui.tenant&&r.orderId===id&&r.status==='SUBMITTED').reduce((s,r)=>s+r.amount,0)}
function submitRemittance(id,amount){if(!canCourier())return err('Hanya kurir dapat menyerahkan setoran.');const o=orderById(id),c=me();if(!allowedTenant(o)||!c||o.courier!==c.id||o.delivery!=='DELIVERED'||!isCOD(o)||o.payment!=='COD_COLLECTED')return err('COD tidak tersedia untuk setoran.');amount=Number(amount);const dueAmt=outstanding(id)-pendingCOD(id);if(!Number.isSafeInteger(amount)||amount<=0||amount>dueAmt)return err('Nominal setoran harus positif dan tidak melebihi outstanding.');const x={id:uid('REM'),tenant:ui.tenant,orderId:id,courierId:c.id,amount,status:'SUBMITTED',at:now(),reviewer:null};O.remittances.unshift(x);audit(o,'COD_REMIT_SUBMITTED',money(amount));render();toast('Setoran diajukan, menunggu Finance');return true;}
function reviewRemittance(remitId,action,reason=''){if(!canFinance())return err('Hanya role Finance/Owner/Manager.');const r=O.remittances.find(x=>x.id===remitId&&x.tenant===ui.tenant);if(!r||r.status!=='SUBMITTED')return err('Setoran sudah diproses atau tidak ada.');if(!['VERIFY','DISPUTE'].includes(action))return err('Aksi tidak sah.');if(action==='DISPUTE'&&reason.trim().length<5)return err('Catat alasan selisih minimal 5 karakter.');if(action==='VERIFY'&&r.amount>outstanding(r.orderId))return err('Setoran melebihi outstanding aktual.');r.status=action==='VERIFY'?'VERIFIED':'DISPUTED';r.reviewedAt=now();r.reviewer=ui.role;r.reason=limitString(reason,200);const o=orderById(r.orderId);if(action==='VERIFY'&&outstanding(r.orderId)===0){o.codRemitted=true;o.payment='PAID'}audit(o,'COD_'+r.status,money(r.amount)+(reason?' · '+reason:''));render();toast('Setoran '+r.status);return true;}
function sampleGPS(){if(!canCourier())return err('Hanya role courier.');const c=me();if(!c)return err('Tidak ada kurir.');const consent=document.getElementById('o22-gps-consent')?.checked;if(!consent)return err('Persetujuan lokasi foreground wajib diberikan.');if(!navigator.geolocation)return err('GPS browser tidak tersedia.');navigator.geolocation.getCurrentPosition(p=>{O.courierLocation[c.id]={tenant:ui.tenant,lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4),accuracy:Math.round(p.coords.accuracy),at:now(),mode:'FOREGROUND_CONSENT'};save();render();toast('Lokasi foreground diperbarui.');},()=>toast('Izin GPS ditolak atau perangkat tidak memberi koordinat.',true),{enableHighAccuracy:false,timeout:7000,maximumAge:30000});}
const gpsStatus=id=>{const p=O.courierLocation[id];if(!p)return 'Belum tersedia';if(p.tenant!==ui.tenant)return 'Tidak tersedia';return Date.now()-Date.parse(p.at)>300000?'Stale (>5 menit)':'Foreground aktif';};
function assignForm(id){const o=orderById(id);if(!allowedTenant(o))return err('Order tidak ditemukan.');const html=`<div class="o22-form"><div class="o22-form-note">${e(o.id)} · ${e(o.customer)} · ${status(o)}</div><label>Pilih kurir dengan kapasitas tersedia</label><select id="o22-assign-courier" class="input">${tc().filter(c=>eligible(o,c)).map(c=>`<option value="${e(c.id)}">${e(c.name)} · ${activeCount(c.id)}/${c.maxActive||3} aktif</option>`).join('')}</select>${note('Assignment memiliki waktu respons 10 menit. Kurir yang offline, berbeda outlet, atau penuh tidak bisa dipilih.')}</div>`;dialog('Assign Courier',html,`o22.assignFromDialog(${idarg(id)})`,'Assign');}
function assignFromDialog(id){const c=document.getElementById('o22-assign-courier')?.value;if(assign(id,c))closeModal();}
function reassignForm(id){const o=orderById(id);if(!allowedTenant(o))return;dialog('Reassign Courier',`<label>Kurir pengganti</label><select class="input" id="o22-next-courier">${tc().filter(c=>c.id!==o.courier&&c.status==='ONLINE'&&courierOutlet(c)===outletOf(o)&&activeCount(c.id)<(c.maxActive||3)).map(c=>`<option value="${e(c.id)}">${e(c.name)}</option>`).join('')}</select><label>Alasan wajib dicatat</label><textarea class="input" rows="3" id="o22-assign-reason" placeholder="Mengapa order dialihkan?"></textarea>`,`o22.reassignFromDialog(${idarg(id)})`,'Reassign');}
function reassignFromDialog(id){const ok=reassign(id,document.getElementById('o22-next-courier')?.value,document.getElementById('o22-assign-reason')?.value||'');if(ok)closeModal();}
function courierForm(id,action){const o=orderById(id);if(!allowedTenant(o))return;let body='',actionName='Lanjutkan';
 if(action==='REJECT'){body=`<label>Alasan penolakan</label><select class="input" id="o22-reject-reason"><option value="">Pilih alasan</option><option>Jarak terlalu jauh</option><option>Kendaraan bermasalah</option><option>Tidak bisa mengambil barang</option><option>Kondisi darurat</option></select>`;actionName='Tolak Tugas';}
 if(action==='PICKUP'){body=`${note('Periksa barang langsung di outlet sebelum menandai pickup.')}${[['order','Nomor order cocok'],['quantity','Jumlah item cocok'],['packaging','Kemasan aman'],['pickup','Barang diserahkan petugas toko']].map(x=>`<label class="o22-check"><input type="checkbox" class="o22-pickup" value="${x[0]}"> ${x[1]}</label>`).join('')}`;actionName='Konfirmasi Pickup';}
 if(action==='FAIL'){body=`<label>Alasan pengiriman gagal</label><select class="input" id="o22-fail-reason"><option value="">Pilih alasan</option><option>Pelanggan tidak di lokasi</option><option>Alamat tidak ditemukan</option><option>Pelanggan menolak menerima</option><option>Akses lokasi terhalang</option></select>`;actionName='Catat Kegagalan';}
 dialog({REJECT:'Tolak assignment',PICKUP:'Checklist Pickup',FAIL:'Gagal Kirim'}[action],body,`o22.submitCourierForm(${idarg(id)},${idarg(action)})`,actionName);
}
function submitCourierForm(id,action){let data={};if(action==='REJECT')data.reason=document.getElementById('o22-reject-reason')?.value;else if(action==='FAIL')data.reason=document.getElementById('o22-fail-reason')?.value;else if(action==='PICKUP')data.checks=[...document.querySelectorAll('.o22-pickup:checked')].map(x=>x.value);const ok=courierAction(id,action,data);if(ok)closeModal();}
function proofForm(id){const o=orderById(id),m=meta(o);if(!allowedTenant(o))return;const method=`<select class="input" id="o22-pod-method" onchange="o22.updateProofMethod()"><option value="otp">OTP demo</option><option value="photo">Foto bukti (metadata demo)</option><option value="signature">Nama tanda tangan (simulasi)</option></select>`;const body=`${note('Bukti hanya disimulasikan lokal. Foto asli tidak diunggah/disimpan; verifikasi OTP demo bukan sistem OTP produksi.')}
 <label>Nama penerima *</label><input id="o22-pod-receiver" class="input" placeholder="Nama penerima barang"/>
 <label>Metode bukti *</label>${method}
 <div id="o22-pod-proof"><label>OTP simulasi · untuk demo: ${e(m.demoOtp||'4826')}</label><input id="o22-pod-otp" class="input" inputmode="numeric" placeholder="Masukkan OTP demo"/></div>
 ${isCOD(o)?`<label>Nominal COD diterima (wajib tepat)</label><input id="o22-pod-cod" type="number" min="0" class="input" value="${e(o.total)}"/><small>Tagihan yang harus ditagih: ${money(o.total)}</small>`:''}`;
 dialog('Proof of Delivery',body,`o22.submitProof(${idarg(id)})`,'Konfirmasi Terkirim');}
function updateProofMethod(){const method=document.getElementById('o22-pod-method')?.value,root=document.getElementById('o22-pod-proof');if(!root)return;root.innerHTML=method==='otp'?`<label>OTP demo untuk pengujian</label><input id="o22-pod-otp" class="input" placeholder="4826" inputmode="numeric"/>`:method==='photo'?`<label>Foto POD simulasi · JPG/PNG max 3MB</label><input id="o22-pod-photo" type="file" class="input" accept="image/png,image/jpeg"/><small>Hanya nama dan jenis file disimpan di prototipe, bukan bytes.</small>`:`<label>Nama penanda tangan</label><input class="input" id="o22-pod-sign" placeholder="Nama penerima"/>`;}
function submitProof(id){const method=document.getElementById('o22-pod-method')?.value,f=document.getElementById('o22-pod-photo')?.files?.[0];if(method==='photo'&&(!f||!['image/png','image/jpeg'].includes(f.type)||f.size>3*1024*1024))return err('Foto harus JPG/PNG maksimum 3MB.');const data={receiver:document.getElementById('o22-pod-receiver')?.value||'',method,otp:document.getElementById('o22-pod-otp')?.value||'',proofName:f?.name||'',signedName:document.getElementById('o22-pod-sign')?.value||'',codAmount:document.getElementById('o22-pod-cod')?.value};const ok=podSubmit(id,data);if(ok)closeModal();}
function exceptionForm(id){if(!canDispatch())return err('Butuh dispatcher.');dialog('Penanganan delivery gagal',`<label>Keputusan dispatcher</label><select class="input" id="o22-exception-decision"><option value="RETRY">Coba kirim ulang</option><option value="RETURN">Kembali ke outlet</option></select><label>Alasan / catatan</label><textarea class="input" id="o22-exception-reason" rows="3" placeholder="Catatan eskalasi"></textarea>`,`o22.submitException(${idarg(id)})`,'Simpan Keputusan');}
function submitException(id){const ok=exceptionAction(id,document.getElementById('o22-exception-decision')?.value,document.getElementById('o22-exception-reason')?.value||'');if(ok)closeModal();}
function returnForm(id){dialog('Penerimaan kembali oleh outlet',`<label>Kondisi barang</label><select class="input" id="o22-return-condition"><option value="QUARANTINE">Karantina / perlu inspeksi</option><option value="SELLABLE">Layak jual (menunggu inventory review)</option><option value="DAMAGED">Rusak</option></select>${note('Retur fisik ini tidak otomatis menghasilkan refund atau stock movement.')}`,`o22.submitReturn(${idarg(id)})`,'Konfirmasi Penerimaan');}
function submitReturn(id){const ok=returnCheckin(id,document.getElementById('o22-return-condition')?.value);if(ok)closeModal();}
function codForm(id){const o=orderById(id);if(!allowedTenant(o))return;dialog('Setoran COD',`<p>Order ${e(id)} · outstanding ${money(outstanding(id))}</p><label>Nominal setor (Rp)</label><input id="o22-cod-amount" type="number" min="1" max="${outstanding(id)-pendingCOD(id)}" class="input" value="${outstanding(id)-pendingCOD(id)}"/>`,`o22.submitCOD(${idarg(id)})`,'Ajukan Setoran');}
function submitCOD(id){const ok=submitRemittance(id,document.getElementById('o22-cod-amount')?.value);if(ok)closeModal();}
function codDisputeForm(id){dialog('Dispute Setoran',`<label>Alasan selisih / bukti kas</label><textarea class="input" rows="3" id="o22-cod-dispute" placeholder="Jelaskan selisih atau bukti yang kurang"></textarea>`,`o22.submitDispute(${idarg(id)})`,'Buat Dispute');}

function podFlagForm(id){dialog('Flag POD untuk investigasi',`<label>Alasan investigasi</label><textarea class="input" rows="3" id="o22-pod-reason"></textarea>`,`o22.submitPodFlag(${idarg(id)})`,'Flag');}

function dialog(title,body,fn,label='Simpan'){ui.modal={type:'o22-dialog',title,body,fn,label};render();}
function modalView(){const m=ui.modal;return `<div class="modal-scrim" onclick="if(event.target===this)closeModal()"><div class="modal o22-dialog" role="dialog" aria-modal="true" aria-label="${e(m.title)}" onclick="event.stopPropagation()"><div class="o22-dialog-head"><h2>${e(m.title)}</h2>${button('Tutup','closeModal()')}</div><div class="o22-form">${m.body}</div><div class="o22-dialog-footer">${button('Batal','closeModal()')}${button(e(m.label),m.fn,'primary')}</div></div></div>`;}
function courierOptions(o){const all=tc().filter(c=>c.status==='ONLINE'&&courierOutlet(c)===outletOf(o));return all.map(c=>`<span class="o22-chip">${e(c.name)} · ${activeCount(c.id)}/${c.maxActive||3}</span>`).join('')||'Tidak ada kurir online';}
function queueCard(o){const m=meta(o);return `<article class="o22-card"><div class="o22-flex"><div><b>${e(o.id)}</b><p>${e(o.customer)} · ${money(o.total)}</p></div>${status(o)}</div><div class="o22-address">${icon('pin',14)} ${e(o.address)}</div><div class="o22-rowfoot"><small>Outlet: ${e(db.outlets.find(x=>x.id===outletOf(o))?.name||'Default')}</small><small>Deadline: ${dateStamp(m.offerExpiresAt)}</small></div><div class="o22-actions">${o.delivery==='READY_FOR_ASSIGNMENT'?button('Assign Kurir',`o22.assignForm(${idarg(o.id)})`,'primary'):''}${o.delivery==='ASSIGNED'?button('Simulasi Timeout',`o22.simulateTimeout(${idarg(o.id)})`):''}${o.delivery==='ASSIGNED'||o.delivery==='ACCEPTED'?button('Reassign',`o22.reassignForm(${idarg(o.id)})`):''}${button('Detail',`o22.showDetail(${idarg(o.id)})`)}</div></article>`;}
function metrics(){const all=ordered();return `<div class="o22-stats">${tiny('Butuh assignment',all.filter(o=>o.delivery==='READY_FOR_ASSIGNMENT').length,'Ready for dispatch')}${tiny('Delivery aktif',all.filter(o=>active.includes(o.delivery)).length,'Diterima / perjalanan')}${tiny('Exception',all.filter(o=>['DELIVERY_FAILED','RETRY_PENDING','RETURN_TO_STORE'].includes(o.delivery)).length,'Perlu tindak lanjut')}${tiny('COD outstanding',money(all.reduce((n,o)=>n+outstanding(o.id),0)),'Kas belum diverifikasi')}</div>`}
function dispatchDashboard(){const list=ordered(),failing=list.filter(o=>['DELIVERY_FAILED','RETRY_PENDING','RETURN_TO_STORE'].includes(o.delivery)),dueList=list.filter(o=>flags(o).assignmentOverdue||flags(o).deliveryOverdue);return `<div class="o22-root">${head('Delivery Operations Center','Antrian, SLA, kurir, COD, dan kendala dalam satu layar. Angka dan lokasi masih data simulasi.')}${metrics()}<div class="o22-grid-2"><section class="o22-card"><h3>Butuh aksi sekarang</h3><p class="o22-muted">Pengiriman membutuhkan penugasan atau keputusan dispatcher.</p>${list.filter(o=>o.delivery==='READY_FOR_ASSIGNMENT').slice(0,5).map(o=>`<div class="o22-list-row"><div><b>${e(o.id)}</b><small>${e(o.customer)}</small></div>${button('Assign',`o22.assignForm(${idarg(o.id)})`,'primary')}</div>`).join('')||empty('Tidak ada order menunggu assignment.')}<div class="o22-actions">${button('Buka Antrian',"navigate('o22-queue')")}</div></section><section class="o22-card"><h3>SLA & exception</h3><p class="o22-muted">Deadline dibuat dari waktu assignment, bukan perkiraan GPS.</p>${dueList.slice(0,3).map(o=>`<div class="o22-list-row"><span>${e(o.id)}</span><span class="o22-pill o22-red">Lewat SLA</span></div>`).join('')}${failing.slice(0,4).map(o=>`<div class="o22-list-row"><span>${e(o.id)}</span>${status(o)}</div>`).join('')||empty('Belum ada exception aktif.')}<div class="o22-actions">${button('Buka Kendala',"navigate('o22-exceptions')")}</div></section></div><div class="o22-grid-2"><section class="o22-card"><h3>Status kurir</h3>${tc().map(c=>`<div class="o22-list-row"><div><b>${e(c.name)}</b><small>${e(c.vehicle)}</small></div><span>${e(c.status)} · ${activeCount(c.id)}/${c.maxActive||3}</span></div>`).join('')}</section><section class="o22-card"><h3>Notifikasi terbaru</h3>${O.notifications.filter(x=>x.tenant===ui.tenant).slice(0,6).map(n=>`<div class="o22-list-row"><div><b>${e(n.message)}</b><small>${dateStamp(n.at)}</small></div></div>`).join('')||empty('Belum ada notifikasi baru.')}</section></div></div>`;}
function queueScreen(){const filter=O.queueFilter||'ALL',all=ordered().filter(o=>['READY_FOR_ASSIGNMENT','ASSIGNED','ACCEPTED','PICKED_UP','IN_TRANSIT','ARRIVED'].includes(o.delivery)),list=all.filter(o=>filter==='ALL'||o.delivery===filter);return `<div class="o22-root">${head('Antrian & Assignment','Validasi eligibility, kapasitas, timeout dan reassignment terkontrol.')}${metrics()}<div class="o22-filters">${[['ALL','Semua'],['READY_FOR_ASSIGNMENT','Butuh kurir'],['ASSIGNED','Menunggu accept'],['ACCEPTED','Diterima'],['IN_TRANSIT','Dalam perjalanan']].map(x=>button(x[1],`o22.setQueueFilter(${idarg(x[0])})`,filter===x[0]?'active':'' )).join('')}</div><div class="o22-card-grid">${list.map(queueCard).join('')||empty('Tidak ada pengiriman untuk filter tersebut.')}</div></div>`;}
function trackingScreen(){return `<div class="o22-root">${head('Monitoring Pengiriman','Tracking status dan status freshness lokasi; peta GPS live tidak disimulasikan sebagai data nyata.')}${metrics()}<div class="o22-card"><h3>Monitoring aktif</h3><div class="o22-table-wrap"><table class="o22-table"><thead><tr><th>Order</th><th>Kurir</th><th>Lokasi</th><th>Deadline</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${ordered().filter(o=>active.includes(o.delivery)).map(o=>`<tr><td><b>${e(o.id)}</b></td><td>${courierName(o)}</td><td>${e(o.courier?gpsStatus(o.courier):'—')}</td><td>${dateStamp(meta(o).deliveryDueAt)} ${flags(o).deliveryOverdue?'<span class="o22-pill o22-red">Overdue</span>':''}</td><td>${status(o)}</td><td>${button('Detail',`o22.showDetail(${idarg(o.id)})`)}</td></tr>`).join('')}</tbody></table></div>${note('Koordinat hanya dapat diperbarui oleh kurir dengan izin foreground. Jika data lebih dari 5 menit, sistem menandainya stale.')}</div></div>`;}
function fleetScreen(){return `<div class="o22-root">${head('Ketersediaan & Kapasitas Kurir','Penugasan dibatasi outlet, status online dan jumlah pekerjaan aktif.')}${metrics()}<div class="o22-card-grid">${tc().map(c=>`<article class="o22-card"><div class="o22-flex"><h3>${e(c.name)}</h3><span class="o22-pill ${c.status==='ONLINE'?'o22-green':'o22-neutral'}">${e(c.status)}</span></div><p>${e(c.vehicle)} · ${e(db.outlets.find(x=>x.id===courierOutlet(c))?.name||'Default outlet')}</p><div class="o22-meter"><span style="width:${Math.min(100,Math.round(activeCount(c.id)/(c.maxActive||3)*100))}%"></span></div><p>${activeCount(c.id)} / ${c.maxActive||3} tugas aktif · GPS ${e(gpsStatus(c.id))}</p><div class="o22-actions">${button(c.status==='ONLINE'?'Jadikan Offline':'Jadikan Online',`o22.setCourierOnline(${idarg(c.id)})`)}</div></article>`).join('')}</div></div>`;}
function setCourierOnline(id){if(!canDispatch())return err('Hanya dispatcher yang mengelola fleet.');const c=tc().find(x=>x.id===id);if(!c)return err('Kurir tidak ditemukan');if(c.status==='ONLINE'&&activeCount(c.id)>0)return err('Kurir dengan tugas aktif tidak dapat dinonaktifkan tanpa handover.');c.status=c.status==='ONLINE'?'OFFLINE':'ONLINE';audit(null,'COURIER_STATUS',`${c.name} → ${c.status}`);render();}
function setSelfOnline(){if(!canCourier())return err('Role kurir diperlukan.');const c=me();if(!c)return err('Kurir tidak tersedia.');if(c.status==='ONLINE'&&activeCount(c.id)>0)return err('Tugas aktif harus diselesaikan atau dialihkan oleh dispatcher.');c.status=c.status==='ONLINE'?'OFFLINE':'ONLINE';audit(null,'COURIER_AVAILABILITY',`${c.name} → ${c.status}`);render();return true;}

function codScreen(){const rem=O.remittances.filter(x=>x.tenant===ui.tenant),out=ordered().filter(o=>isCOD(o)&&meta(o).codCollected>0),pending=rem.filter(x=>x.status==='SUBMITTED');return `<div class="o22-root">${head('COD & Rekonsiliasi','COD collected, submitted, verified dan disputed memiliki state berbeda. Payment tidak otomatis paid saat POD.')}${tiny('COD tertagih',money(out.reduce((n,o)=>n+meta(o).codCollected,0)))} <div class="o22-grid-2"><section class="o22-card"><h3>Outstanding per pengiriman</h3>${out.map(o=>`<div class="o22-list-row"><div><b>${e(o.id)}</b><small>${courierName(o)}</small></div><div style="text-align:right"><b>${money(outstanding(o.id))}</b><small>Pending ${money(pendingCOD(o.id))}</small></div></div>`).join('')||empty('Belum ada COD yang ditagih.')}</section><section class="o22-card"><h3>Setoran menunggu Finance</h3>${pending.map(r=>`<div class="o22-list-row"><div><b>${e(r.orderId)}</b><small>${e(r.id)} · ${money(r.amount)}</small></div><div class="o22-actions">${canFinance()?button('Verify',`o22.reviewRemittance(${idarg(r.id)},'VERIFY')`,'primary'):''}${canFinance()?button('Dispute',`o22.codDisputeForm(${idarg(r.id)})`):''}</div></div>`).join('')||empty('Tidak ada setoran pending.')}</section></div><div class="o22-card"><h3>Riwayat setoran</h3><div class="o22-table-wrap"><table class="o22-table"><thead><tr><th>ID</th><th>Order</th><th>Kurir</th><th>Nominal</th><th>Status</th><th>Reviewer</th></tr></thead><tbody>${rem.map(r=>`<tr><td>${e(r.id)}</td><td>${e(r.orderId)}</td><td>${e(tc().find(c=>c.id===r.courierId)?.name)}</td><td>${money(r.amount)}</td><td>${e(r.status)}</td><td>${e(r.reviewer||'—')}</td></tr>`).join('')}</tbody></table></div></div></div>`;}

function courierTasksScreen(){const c=me();if(!c)return empty('Tidak ada akun kurir.');const all=ordered().filter(o=>o.courier===c.id&&!complete.includes(o.delivery)),filter=O.taskFilter||'ACTIVE',list=all.filter(o=>filter==='ALL'||filter==='ACTIVE'&&active.includes(o.delivery)||filter==='FAILED'&&['DELIVERY_FAILED','RETURN_TO_STORE'].includes(o.delivery));return `<div class="o22-root o22-courier">${head('Tugas Saya','Mobile-first · satu order per kartu, dengan validasi status dan checklist.')}${tiny('Tugas berjalan',all.length)}<div class="o22-filters">${[['ACTIVE','Aktif'],['FAILED','Kendala'],['ALL','Semua']].map(x=>button(x[1],`o22.setTaskFilter(${idarg(x[0])})`,filter===x[0]?'active':'' )).join('')}</div>${list.map(taskCard).join('')||empty('Tidak ada tugas untuk filter ini.')}</div>`;}
