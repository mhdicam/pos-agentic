function inboxScreen(){const conversations=tconv().filter(c=>ui.inboxFilter==='all'||ui.inboxFilter==='human'&&c.owner==='HUMAN_ACTIVE'||ui.inboxFilter==='ai'&&c.owner==='AI_ACTIVE'),c=getConv(),t=tenant();const contact=db.contacts.find(x=>x.id===c?.contact);if(c)ui.activeConv=c.id;return page('Unified AI Inbox','WhatsApp conversations · assist/auto AI · human handoff.',btn(icon('plus',15)+' Simulasikan Chat Masuk',"openModal('inbound')",'primary'))+`<div class="stats-grid">${stat('Percakapan',tconv().length,'message')}${stat('AI Active',tconv().filter(c=>c.owner==='AI_ACTIVE').length,'bot')}${stat('Human Active',tconv().filter(c=>c.owner==='HUMAN_ACTIVE').length,'users')}${stat('AI credits tersisa',Math.max(0,t.aiCredits-t.aiUsed),'bolt')}</div><div class="panel inbox-layout ${ui.inboxMobileChat?'show-chat':''}"><section class="inbox-list"><div class="panelpad"><h3 class="pheading">Inbox</h3><div class="subtext" style="margin:6px 0 13px">Percakapan per tenant / brand</div><div class="filters" style="margin:0">${[['all','All'],['ai','AI'],['human','Human']].map(x=>`<button class="filter ${ui.inboxFilter===x[0]?'active':''}" onclick="ui.inboxFilter='${x[0]}';ui.inboxMobileChat=false;render()">${x[1]}</button>`).join('')}</div></div><div class="sep"></div><div style="max-height:570px;overflow-y:auto">${conversations.map(x=>`<button class="inbox-conv ${c?.id===x.id?'active':''}" onclick="ui.activeConv='${x.id}';ui.inboxMobileChat=true;markRead('${x.id}');render()"><span class="conv-avatar">${esc(x.name.slice(0,1))}</span><span style="flex:1;min-width:0"><span class="between"><b style="font-size:11px">${esc(x.name)}</b><small style="color:#98a7bb;font-size:9px">${dt(x.last)}</small></span><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8b99af;font-size:10px;margin:6px 0">${esc(x.messages.at(-1)?.text||'')}</span><span class="between">${tag(x.owner==='AI_ACTIVE'?'AI':'Human',x.owner==='AI_ACTIVE'?'green':'amber')}${x.unread?`<span class="tag violet">${x.unread}</span>`:''}</span></span></button>`).join('')}${!conversations.length?blank('Tidak ada conversation','Klik simulasikan chat masuk di kanan atas.','message'):''}</div></section><section class="chat-pane">${c?`<div class="between" style="padding:12px 15px;border-bottom:1px solid #edf0f5;gap:7px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:9px"><button class="btn ghost sm" style="padding:6px" onclick="ui.inboxMobileChat=false;render()">${icon('left',17)}</button><span class="conv-avatar" style="width:30px;height:30px">${esc(c.name[0])}</span><div><b style="font-size:12px">${esc(c.name)}</b><div class="subtext">WhatsApp ${esc(c.channel)} · ${c.owner==='AI_ACTIVE'?'AI ownership':'Human ownership'}</div></div></div><div>${statusBadge(c.owner)}</div></div><div class="chat-scroll">${c.messages.map(m=>`<div class="bubble ${m.by}"><small style="display:block;font-weight:800;opacity:.6;margin-bottom:4px">${m.by==='in'?'Customer':m.by==='ai'?'AI Agent (simulated)':'Human staff'}</small>${esc(m.text)}<small style="display:block;text-align:right;opacity:.48;margin-top:5px">${dt(m.at)}</small></div>`).join('')}${c.draft?`<div class="notice" style="margin-left:auto;max-width:92%"><b>AI suggested reply (not sent)</b><p style="margin:7px 0">${esc(c.draft)}</p>${btn('Gunakan saran '+icon('send',13),`useAiDraft('${c.id}')`,'subtle sm')}</div>`:''}</div><div style="padding:9px 13px;border-top:1px solid #e9edf3;background:#fafcff;display:flex;align-items:center;gap:8px;flex-wrap:wrap">${c.owner==='AI_ACTIVE'?btn(icon('users',14)+' Take over',`handoff('${c.id}','HUMAN_ACTIVE')`,'outline sm'):btn(icon('bot',14)+' Release to AI',`handoff('${c.id}','AI_ACTIVE')`,'subtle sm')}${btn(icon('spark',14)+' AI Suggest',`generateSuggestion('${c.id}')`,'outline sm')}${tag(t.aiMode==='auto'?'AUTO REPLY':t.aiMode==='assist'?'ASSIST MODE':'AI OFF',t.aiMode==='auto'?'green':'slate')}</div><div class="chat-composer"><input id="chat-send" class="input" placeholder="Tulis pesan sebagai human agent..." onkeydown="if(event.key==='Enter'){event.preventDefault();sendHuman()}"/>${btn(icon('send',16),"sendHuman()",'primary')}</div>`:blank('Pilih percakapan','Mulai dari pesan masuk baru atau pilih kontak yang ada.','message')}</section><aside class="context-pane"><h3 class="pheading">Customer Context</h3>${c?`<div class="context-item"><div class="subtext">Pelanggan</div><b>${esc(c.name)}</b><div class="subtext">${esc(contact?.phone?.replace(/(\d{3})\d+(\d{2})/,'$1****$2')||'Nomor tersembunyi')}</div></div><div class="context-item"><div class="subtext">CRM Stage</div><b>${esc(contact?.stage||'New Lead')}</b></div><div class="context-item"><div class="subtext">CRM Label</div>${tag(contact?.label||'New')}</div><div class="context-item"><div class="subtext">Conversation</div>${statusBadge(c.owner)}</div><div class="context-item"><div class="subtext">Credit budget</div><b>${t.aiUsed} / ${t.aiCredits}</b><div class="statbar" style="margin-top:9px"><span style="width:${Math.min(100,t.aiUsed/t.aiCredits*100)||0}%"></span></div></div><div class="notice" style="margin-top:15px">Customer memory dibatasi berdasarkan tenant, izin dan kebijakan retensi. Nomor telepon saja bukan bukti kepemilikan order.</div>`:''}</aside></div>`}
function markRead(id){const c=db.conversations.find(c=>c.id===id);if(c?.tenant===ui.tenant)c.unread=0;save()}
function handoff(id,newOwner){const c=db.conversations.find(c=>c.id===id);if(!c||c.tenant!==ui.tenant)return;if(newOwner==='AI_ACTIVE'&&tenant().aiMode==='off'){toast('Aktifkan AI mode terlebih dahulu.',true);return}c.owner=newOwner;c.draft=null;act(`Chat ${c.name} ${newOwner==='AI_ACTIVE'?'release ke AI':'diambil alih human staff'}`,'ai');render();toast(newOwner==='HUMAN_ACTIVE'?'Human takeover aktif—AI auto-reply dihentikan.':'Kontrol dikembalikan ke AI.')}
function sendHuman(){const c=getConv(),input=document.getElementById('chat-send'),msg=input?.value.trim();if(!c||!msg)return;if(c.owner!=='HUMAN_ACTIVE'){toast('Take over dulu sebelum membalas sebagai staff.',true);return}c.messages.push({by:'out',text:msg,at:now()});c.last=now();c.draft=null;act(`Human reply ke ${c.name}`,'ai');render();toast('Pesan dikirim (simulasi)')}
function aiSuggestFor(message){const q=message.toLowerCase(),t=tenant(),product=tp().find(p=>q.includes(p.name.toLowerCase())||q.includes(p.name.split(' ').at(-1).toLowerCase()));if(/status|resi|pesanan|order saya|pembayaran saya|alamat pelanggan/.test(q))return 'Tentu, aku bisa bantu cek status. Untuk keamanan, mohon verifikasi kepemilikan pesanan lewat jalur resmi toko ya. Aku tidak akan membagikan data pribadi hanya berdasarkan nomor WhatsApp.';if(/refund|komplain|marah|rusak|terlambat/.test(q))return 'Terima kasih sudah menghubungi kami. Untuk kasus ini aku akan meneruskan ke tim customer service agar ditangani dengan tepat.';if(product)return `Hai! ${product.name} ${product.stock?'masih tersedia ('+product.stock+' unit dalam data demo)':'sedang tidak tersedia'}. Harganya ${fmt(product.price)}. Mau aku bantu info produk lain?`;const faq=tk().find(k=>k.published&&(q.includes(k.question.toLowerCase().split(' ')[0])||q.includes('jam')&&k.question.toLowerCase().includes('jam')||q.includes('delivery')&&k.question.toLowerCase().includes('delivery')));if(faq)return faq.answer;return `Halo, terima kasih sudah menghubungi ${t.brand}! Aku bisa membantu pertanyaan terkait produk, jam toko, pickup, dan delivery. Untuk hal sensitif aku akan mengarahkan ke staf. (Respons simulasi, bukan model AI nyata.)`}
function chargeAI(){const t=tenant();if(t.aiUsed>=Math.min(t.aiCredits,t.aiBudget)){toast('AI credits mencapai hard limit. Pesan dialihkan ke staff.',true);return false}t.aiUsed++;save();return true}
function generateSuggestion(id){const c=db.conversations.find(c=>c.id===id);if(!c||c.tenant!==ui.tenant)return;if(tenant().aiMode==='off'){toast('AI mode sedang OFF. Aktifkan di Settings.',true);return}if(!chargeAI()){c.owner='HUMAN_ACTIVE';render();return}c.draft=aiSuggestFor(c.messages.filter(m=>m.by==='in').at(-1)?.text||'');act(`AI suggestion dibuat untuk ${c.name}`,'ai');render();toast('AI suggested reply dibuat (mock rule engine).')}
function useAiDraft(id){const c=db.conversations.find(c=>c.id===id);if(!c||c.tenant!==ui.tenant||!c.draft)return;if(c.owner!=='HUMAN_ACTIVE'){toast('Human takeover diperlukan untuk mengirim draft manual.',true);return}c.messages.push({by:'out',text:c.draft,at:now()});c.draft=null;c.last=now();act('AI suggestion dikirim manual oleh staff','ai');render();toast('Draft dikirim sebagai human agent (demo)')}
function submitInbound(){const name=document.getElementById('inb-name')?.value.trim(),text=document.getElementById('inb-text')?.value.trim(),channel=document.getElementById('inb-channel')?.value;if(!name||!text){toast('Isi nama dan pesan pelanggan.',true);return}const t=tenant();if(channel==='Official'&&t.waOfficial!=='CONNECTED'||channel==='Unofficial'&&t.waUnofficial!=='CONNECTED'){toast('Hubungkan channel WhatsApp demo terlebih dahulu.',true);return}let c=tconv().find(x=>x.name.toLowerCase()===name.toLowerCase());if(!c){const ct={id:uid('ct'),tenant:ui.tenant,name,phone:'08**********',label:'New',stage:'New Lead',notes:'',last:now()};db.contacts.push(ct);c={id:uid('cv'),tenant:ui.tenant,contact:ct.id,name,owner:'AI_ACTIVE',channel,unread:0,last:now(),messages:[]};db.conversations.unshift(c)}c.messages.push({by:'in',text,at:now()});c.last=now();c.unread++;if(c.owner==='AI_ACTIVE'&&t.aiMode==='auto'&&chargeAI()){c.messages.push({by:'ai',text:aiSuggestFor(text),at:now()});if(/komplain|refund|marah/.test(text.toLowerCase()))c.owner='HUMAN_ACTIVE'}else if(c.owner==='AI_ACTIVE'&&t.aiMode==='assist'&&chargeAI())c.draft=aiSuggestFor(text);else if(c.owner==='AI_ACTIVE'&&t.aiMode==='off')c.owner='HUMAN_ACTIVE';ui.activeConv=c.id;ui.inboxMobileChat=true;act(`Pesan WhatsApp masuk dari ${name} (${channel})`,'ai');closeModal();toast('Pesan masuk dibuat (simulasi)')}

function qrPattern(){let html='';for(let y=0;y<15;y++)for(let x=0;x<15;x++){let finder=(ox,oy)=>x>=ox&&x<ox+5&&y>=oy&&y<oy+5&&(x===ox||x===ox+4||y===oy||y===oy+4||x>=ox+2&&x<=ox+2&&y>=oy+2&&y<=oy+2),dark=finder(0,0)||finder(10,0)||finder(0,10)||((x*37+y*17+x*y*13)%7<3&&!((x<6&&y<6)||(x>8&&y<6)||(x<6&&y>8)));html+=`<i class="${dark?'dark':''}"></i>`}return html}

 else if(m.type==='tenant'){const x=db.tenants.find(t=>t.id===m.id);title='Tenant Metadata';body=x?`<div class="stack">${[['Tenant','brand'],['Workspace','name'],['Slug','slug'],['Plan','plan'],['Status','status']].map(([a,b])=>`<div class="between"><span class="subtext">${a}</span><b>${esc(x[b])}</b></div>`).join('')}<div class="notice">Administrative view intentionally excludes customer contacts, order details, and AI transcripts.</div></div>`:'';foot=btn('Tutup',"closeModal()",'primary')}
 else if(m.type==='invoices'){title='Invoice Metadata';body=db.invoices.filter(i=>i.tenant===ui.tenant).map(i=>`<div class="between" style="padding:12px 0;border-bottom:1px solid #edf0f5"><div><b>${i.id}</b><div class="subtext">${i.date}</div></div><div style="text-align:right"><b>${fmt(i.amount)}</b><div>${statusBadge(i.status)}</div></div></div>`).join('')||blank('Belum ada invoice','Invoice tenant aktif kosong.');foot=btn('Tutup',"closeModal()",'primary')}
 else if(m.type==='notifications'){title='Aktivitas Terbaru';body=db.events.filter(e=>e.tenant===ui.tenant).slice(0,9).map(e=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eff2f6">${icon('bell',16)}<div><b style="font-size:11px">${esc(e.text)}</b><div class="subtext">${dt(e.time)}</div></div></div>`).join('')||blank('Tidak ada notifikasi','Aktivitas baru akan muncul di sini.');foot=btn('Tutup',"closeModal()",'primary')}
 else if(m.type==='onboarding'){title='Tenant Onboarding · Step '+(ui.onboardStep+1)+'/4';const steps=[['Identitas brand',`Brand demo <b>${esc(t.brand)}</b> sudah dibuat. Sesuaikan tema dan tagline untuk storefront.`,'storefront'],['Tambahkan produk','Isi katalog, harga, SKU dan stok sebelum mencoba POS dan storefront.','catalog'],['Konfigurasi delivery','Atur outlet, kurir dan simulasi dispatch pada Delivery Board.','delivery'],['Aktifkan AI Agent','Konfigurasikan persona, knowledge base, dan WhatsApp channel saat siap.','ai-settings']];body=`<div class="eyebrow">WORKSPACE SETUP</div><h2 style="font-size:22px;margin:11px 0">${steps[ui.onboardStep][0]}</h2><p class="subtext" style="line-height:1.9">${steps[ui.onboardStep][1]}</p><div class="timeline" style="margin:27px 0">${steps.map((s,i)=>`<div class="timeline-step ${i<=ui.onboardStep?'done':''}"><i>${i+1}</i>${s[0]}</div>`).join('')}</div><div class="notice">Panduan ini merepresentasikan onboarding UI. Payment setup, verifikasi domain dan verifikasi email belum terkoneksi.</div>`;foot=btn('Lewati',"closeModal()",'outline')+btn('Buka halaman ini',`closeModal();navigate('${steps[ui.onboardStep][2]}')`,'subtle')+(ui.onboardStep<3?btn('Selanjutnya '+icon('arrow',14),"ui.onboardStep++;render()",'primary'):btn('Selesai '+icon('check',14),"closeModal()",'primary'))}
 return `<div class="modal-scrim" onclick="if(event.target===this)closeModal()"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal ${wide?'wide':''}"><header class="modal-header"><h2 style="font-weight:800;font-size:16px;margin:0">${title}</h2><button class="btn ghost icononly" aria-label="Tutup" onclick="closeModal()">${icon('close',18)}</button></header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`}
function lookupOrder(){const id=document.getElementById('lookup-order')?.value.trim().toUpperCase(),o=orderById(id);if(!o||o.tenant!==ui.storeTenant){toast('Nomor pesanan tidak ditemukan pada toko ini.',true);return}openTrack(id)}
// Fix demo-button metadata: fourth argument is optional attribute string, not part of classes.
const _btn=btn;btn=function(txt,fn,style='outline',extra=''){const attrs=extra&&(extra.startsWith('style=')||extra==='disabled'||extra.startsWith('aria-'))?` ${extra}`:'';const cls=attrs?'':` ${extra}`;return `<button type="button" class="btn ${style}${cls}" onclick="${fn}"${attrs}>${txt}</button>`};
// Basic escape handling and runtime error feedback, intended for prototype debugging only.
window.addEventListener('error',e=>{console.error('[ORBiS prototype error]',e.error||e.message)});

<script>
/* Phase 2.2 Role-Level UX Hardening — additive, simulation only */
(function(){
const MODELS={
 platform:{title:'Platform Governance',slice:'08',tabs:['Tenant lifecycle','Billing & plans','Incident & audit'],rows:[['Tenant lifecycle','Suspend tenant dengan alasan, lalu aktifkan kembali','suspend'],['Billing & plans','Invoice gagal, grace period dan entitlement','invoice'],['Incident & audit','Approval grant support sementara dan pencabutan akses','grant']]},
 support:{title:'Support Operations',slice:'08',tabs:['Ticket queue','Diagnostics','Access grant'],rows:[['Ticket queue','Buat ticket, triage, resolve','ticket'],['Diagnostics','Status koneksi WhatsApp tanpa melihat isi chat','diagnostic'],['Access grant','Request approval akses tenant, revoke','grant']]},
 owner:{title:'Merchant Setup & Governance',slice:'02',tabs:['Onboarding','Brand & outlet','People & permissions'],rows:[['Onboarding','Checklist aktivasi layanan, publish setelah siap','publish'],['Brand & outlet','Uji brand preview dan publikasi versi','brand'],['People & permissions','Invite dengan scope dan entitlement','invite']]},
 brand:{title:'Brand Management',slice:'02',tabs:['Theme versions','Product policies','Scope checks'],rows:[['Theme versions','Preview, publish, rollback tema','brand'],['Product policies','Atur aturan konten dan FAQ','kb'],['Scope checks','Uji penolakan akses ke brand lain','deny']]},
 manager:{title:'Outlet Operations',slice:'02',tabs:['Fulfillment','Stock exception','Refund approval'],rows:[['Fulfillment','Terima dan proses order sampai ready','fulfill'],['Stock exception','Penyesuaian stok beralasan, tolak stok negatif','stock'],['Refund approval','Review permohonan refund kasir','refund-approve']]},

 dispatcher:{title:'Dispatch Exception Center',slice:'04',tabs:['Ready queue','Assignment','Exceptions'],rows:[['Ready queue','Tampilkan order delivery siap dispatch','queue'],['Assignment','Reassign kurir dengan alasan, hanya satu penugasan aktif','reassign'],['Exceptions','Retry pengiriman gagal atau return ke outlet','delivery-exception']]},

 ai:{title:'AI Readiness & Safety Console',slice:'06',tabs:['AI evaluation','Channel health','Budget & sources'],rows:[['AI evaluation','Uji sumber FAQ dan alasan handoff tanpa AI live','ai-test'],['Channel health','Simulasikan disconnect dan reconnect Official/Unofficial','channel'],['Budget & sources','Preview aturan limit dan indeks knowledge base','budget']]},
 cs:{title:'CS Queue & CRM Pipeline',slice:'07',tabs:['Assignment / SLA','Human handoff','Follow-ups'],rows:[['Assignment / SLA','Claim ticket chat yang belum ditugaskan','claim'],['Human handoff','Ambil alih, catat alasan, kembalikan ke AI','handoff'],['Follow-ups','Jadwalkan follow-up dan kelola pipeline','followup']]},
 finance:{title:'Finance Reconciliation',slice:'07',tabs:['Sales & cash','COD reconciliation','Locked periods'],rows:[['Sales & cash','Bandingkan total payment dan cash drawer','reconcile'],['COD reconciliation','Audit COD collected dan remitted','cod'],['Locked periods','Tutup periode dan ekspor ringkasan','close-period']]}
};

function log(type,detail){local().workflow.unshift({id:uid('ux'),tenant:ui.tenant,role:ui.role,type,detail,time:now()});act('UX 2.2 · '+detail,'ux');save()}

function choice(list,id){return `<select id="${id}" class="input">${list.map(x=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('')}</select>`}

function section(t,content){return `<section class="panel panelpad"><div class="pheading">${t}</div><div style="margin-top:13px">${content}</div></section>`}
function screen(){const conf=MODELS[ui.role];if(!conf)return '';const tab=Math.min(ux22.tab[ui.role]||0,2),r=conf.rows[tab];return `<div class="ux-workbench">${page(conf.title,'Phase 2.2 · role-specific interaction hardening · semua aksi merupakan simulasi lokal.',tag('Slice UX-'+conf.slice,'violet'))}
 ${note('PROTOTYPE ONLY — perubahan tersimpan secara lokal. Permission, MFA, payment, WhatsApp, tracking dan tenant isolation belum divalidasi oleh backend produksi.','warn')}
 <div class="ux-tabs" role="tablist">${conf.tabs.map((label,i)=>`<button class="${i===tab?'active':''}" role="tab" aria-selected="${i===tab}" onclick="ux22.select(${i})">${esc(label)}</button>`).join('')}</div>
 <div class="ux-columns"><div class="stack">${section(r[0],`<p class="subtext">${r[1]}</p>${actionContent(r[2])}`)}${section('State & validation',validation(r[2]))}</div><div class="stack">${section('Aktivitas terbaru',items().length?items().map(x=>`<div class="ux-event"><b>${esc(x.detail)}</b><div class="subtext">${esc(x.role)} · ${dt(x.time)}</div></div>`).join(''):blank('Belum ada aktivitas','Coba aksi pada panel kiri.'))}${section('UX acceptance · '+esc(ui.role),`<div class="ux-checklist">${acceptance(ui.role).map(x=>`<label><input type="checkbox" onchange="ux22.check(this,'${esc(x).replace(/'/g,'&#39;')}')"/> ${esc(x)}</label>`).join('')}</div>`)}</div></div></div>`}
function validation(type){const d={suspend:'Alasan wajib · tidak menghapus data finansial · support tidak boleh suspend.',invoice:'Simpan invoice dalam status terpisah dari transaksi merchant.',grant:'Akses support harus approval, scope, ticket, kedaluwarsa dan revoke.',ticket:'Status NEW → TRIAGED → RESOLVED · catat severity.',diagnostic:'Hanya metadata konektor; konten chat tetap disembunyikan.',publish:'Cek brand, outlet, katalog dan pembayaran sebelum publish.',brand:'Publish menciptakan version; rollback tidak mengubah sibling brand.',invite:'Role, email dan outlet diperlukan, tidak boleh platform role.',kb:'Konten dinilai terhadap sumber published saja.',deny:'Akses lain tenant dan brand adalah denied.',fulfill:'Hanya order pada state yang valid boleh lanjut.',stock:'Stok tidak boleh negatif, adjustment wajib alasan.', 'refund-approve':'Refund harus diajukan dan disetujui sebelum PAID→REFUNDED.',shift:'Penutupan shift meminta counted cash.',hold:'Keranjang yang ditahan harus bisa dipulihkan tanpa menggandakan order.',refund:'Kasir hanya request, bukan approve.',queue:'Hanya READY delivery yang eligible.',reassign:'Tidak boleh dua kurir aktif pada order sama.', 'delivery-exception':'Alasan exception wajib dan terekam.',reject:'Hanya tugas kurir sendiri dapat ditolak.',cod:'COD collected bukan otomatis reconciled.',checkout:'Validasi nomor kontak, metode, alamat dan stok.',tracking:'Token demo diwajibkan; nomor order saja tidak membuktikan kepemilikan.', 'customer-request':'Request tidak langsung memodifikasi status pembayaran.', 'ai-test':'Jawaban hanya dari data terpublikasi dan tidak menyatakan status tanpa verifikasi.',channel:'Channel unavailable tidak boleh membuat phantom send.',budget:'Hard limit AI, KB published, no unrestricted tools.',claim:'Satu pemilik chat aktif, assignment diaudit.',handoff:'HUMAN_ACTIVE menghentikan auto-send.',followup:'Dibutuhkan due date dan pemilik.',reconcile:'Pending, paid dan COD collected dihitung terpisah.','close-period':'Closed period immutable kecuali adjustment disetujui.'};return note(esc(d[type]||'Semua perubahan harus teraudit.'))}
function acceptance(role){const base=['Desktop dan mobile 320–1440px','Empty / invalid / failed state tersedia','Aksi dan perubahan state tercatat'];return [...base,...({platform:['Suspend membutuhkan alasan','Support grant memiliki expiration'],support:['Ticket severity, SLA dan penyelesaian','Tanpa approval, akses tenant ditolak'],owner:['Onboarding selesai sebelum publish','Scope staff outlet diperiksa'],brand:['Brand lain tidak bisa diubah','Rollback memulihkan versi'],manager:['Stok tidak negatif','Refund perlu approval'],cashier:['Shift gate aktif','Double-click payment tidak duplikat'],dispatcher:['Reject kembali ke dispatch queue','Reassign single ownership'],courier:['Exception alasan wajib','COD terpisah dari remittance'],customer:['Checkout gagal tidak buat order','Tracking memerlukan token'],ai:['Human handoff membekukan AI','No cross-tenant knowledge'],cs:['SLA dan assignment terlihat','AI dan human tidak double-send'],finance:['Variance terdeteksi','Periode yang dikunci read-only']}[role]||[])]}
function actionContent(type){let os=to(),first=os[0],dl=os.filter(o=>o.method==='delivery'),opts=(list,label)=>list.map(o=>({id:o.id,label:label?label(o):o.id}));switch(type){
case 'suspend':return choice(db.tenants.map(x=>({id:x.id,label:x.brand+' · '+x.status})),'ux-tenant')+field('ux-reason','Alasan','','Wajib')+button('Ubah status tenant',type);
case 'invoice':return choice(db.invoices.map(x=>({id:x.id,label:x.id+' · '+x.status})),'ux-id')+button('Simulasi invoice payment failure',type);
case 'grant':return field('ux-ticket','Nomor ticket / alasan akses','','SUP-001')+choice(db.tenants.map(x=>({id:x.id,label:x.brand})),'ux-tenant')+`<div class="field"><label>Durasi grant</label><select id="ux-duration" class="input"><option value="15">15 menit</option><option value="30">30 menit</option></select></div>`+button('Buat / approve permintaan',type);
case 'ticket':return field('ux-reason','Masalah / ticket title','','Webhook tidak masuk')+`<select id="ux-severity" class="input"><option>P2</option><option>P1</option><option>P3</option></select>`+button('Buat ticket',type)+local().tickets.map(t=>`<div class="ux-event">${esc(t.title)} · ${tag(t.status)} <button class="btn sm outline" onclick="ux22.resolve('${t.id}')">Resolve</button></div>`).join('');
case 'diagnostic':return db.tenants.map(t=>`<div class="ux-event">${esc(t.brand)} · Official: ${tag(t.waOfficial)} · Unofficial: ${tag(t.waUnofficial)}</div>`).join('')+button('Audit diagnostic access',type,'outline');
case 'publish':return `<p class="subtext">Produk: ${tp().length} · Outlet: ${db.outlets.filter(x=>x.tenant===ui.tenant&&x.active).length}</p>`+button('Validasi dan publish storefront',type);
case 'brand':return field('ux-theme','Nama theme version',tenant().brand+' v2')+button('Publish / rollback versi',type);
case 'invite':return field('ux-email','Alamat email','','staff@toko.id','email')+choice(db.outlets.filter(x=>x.tenant===ui.tenant).map(x=>({id:x.id,label:x.name})),'ux-outlet')+`<select class="input" id="ux-staff-role"><option>cashier</option><option>manager</option><option>cs</option><option>dispatcher</option></select>`+button('Simulasikan invitation',type);
case 'kb':return `<p class="subtext">${tk().filter(x=>x.published).length} FAQ telah published.</p>`+button('Audit scope sumber',type,'outline');
case 'deny':return button('Uji akses resource tenant lain (expected denied)',type,'outline');
case 'fulfill':return choice(opts(os,o=>o.id+' · '+o.status),'ux-order')+button('Advance fulfillment',type);
case 'stock':return choice(opts(tp(),o=>o.name+' · stock '+o.stock),'ux-product')+field('ux-qty','Delta stok (+ / -)','-1','','number')+field('ux-reason','Alasan','','Stock opname')+button('Terapkan adjustment',type);
case 'refund':return choice(opts(os.filter(x=>x.payment==='PAID')),'ux-order')+field('ux-reason','Alasan refund','','Pesanan salah')+button('Ajukan refund',type);
case 'refund-approve':return local().refunds.filter(x=>x.tenant===ui.tenant&&x.status==='REQUESTED').map(x=>`<div class="ux-event">${x.order} · ${esc(x.reason)} ${button('Approve '+x.id,'approve:'+x.id)}</div>`).join('')||note('Tidak ada refund pending. Login sebagai Cashier untuk membuat request.');
case 'shift':return `<p>Shift: ${tag(ui.shiftOpen?'OPEN':'CLOSED',ui.shiftOpen?'green':'amber')}</p>`+field('ux-cash','Uang kas dihitung (Rp)','0','','number')+button(ui.shiftOpen?'Tutup shift':'Buka shift',type);
case 'hold':return `<p class="subtext">Item keranjang: ${ui.posCart.length}. Hold cart sebelum checkout.</p>`+button('Hold / Resume cart',type);
case 'queue':return `<div>${dl.filter(x=>x.status==='READY').map(x=>`<div class="ux-event">${x.id} · ${x.customer} · ${tag(x.delivery)}</div>`).join('')||note('Tidak ada order READY untuk dispatch.')}</div>`+button('Refresh eligibility',type,'outline');
case 'reassign':return choice(opts(dl),'ux-order')+choice(opts(tc(),x=>x.name),'ux-courier')+field('ux-reason','Alasan reassignment','','Courier unavailable')+button('Reassign courier',type);
case 'delivery-exception':return choice(opts(dl),'ux-order')+`<select id="ux-exception" class="input"><option value="CUSTOMER_UNAVAILABLE">Customer tidak ada</option><option value="RETRY_SCHEDULED">Jadwalkan retry</option><option value="RETURN_TO_OUTLET">Kembalikan ke outlet</option></select>`+field('ux-reason','Catatan kejadian','','Wajib')+button('Update exception',type);
case 'reject':return choice(opts(dl.filter(x=>!!x.courier)),'ux-order')+field('ux-reason','Alasan penolakan','','Tidak dapat mengambil tugas')+button('Tolak assignment',type);
case 'cod':return `<p class="subtext">Order COD collected: ${os.filter(x=>x.payment==='COD_COLLECTED').length}</p>`+choice(opts(os.filter(x=>x.payment==='COD_COLLECTED')),'ux-order')+button('Konfirmasi remittance',type);
case 'checkout':return field('ux-address','Alamat pengiriman','','Minimal 12 karakter')+field('ux-phone','Nomor HP pelanggan','','081234567890')+button('Uji serviceability',type);
case 'tracking':return field('ux-order','Nomor order','','ORD-1001')+field('ux-token','Token akses demo','','Gunakan: DEMO-TRACK')+button('Verifikasi tracking',type);
case 'customer-request':return choice(opts(db.orders.filter(x=>x.tenant===ui.storeTenant)),'ux-order')+field('ux-reason','Alasan bantuan','','Pesanan belum datang')+button('Kirim permintaan support',type);
case 'ai-test':return field('ux-question','Pertanyaan uji','','Jam buka toko?')+button('Evaluasi FAQ published',type)+`<div id="ux-ai-output"></div>`;
case 'channel':return choice([{id:'official',label:'Official Cloud API'},{id:'unofficial',label:'Unofficial QR (experimental)'}],'ux-channel')+button('Simulasikan putus / sambung',type);
case 'budget':return `<p class="subtext">AI credits: ${tenant().aiUsed}/${tenant().aiCredits} · Budget: ${tenant().aiBudget}</p>`+button('Audit budget dan sumber',type,'outline');

case 'handoff':return choice(opts(tconv(),x=>x.name+' · '+x.owner),'ux-conversation')+field('ux-reason','Alasan handoff','','Butuh manusia')+button('Toggle AI / human ownership',type);

default:return button('Run test',type);
}}
function value(id){return (document.getElementById(id)?.value||'').trim()}
function required(id,label){let v=value(id);if(!v){toast(label+' wajib diisi',true);return null}return v}
function action(type){if(!permissions[ui.role]?.includes(type)&&!type.startsWith('approve:')){toast('Role tidak diizinkan',true);return}const h=local(),ord=()=>db.orders.find(o=>o.id===value('ux-order')&&o.tenant===ui.tenant),reason=()=>required('ux-reason','Alasan');let msg='';
 if(type==='suspend'){const t=db.tenants.find(x=>x.id===value('ux-tenant'));if(!t||!reason())return;t.status=t.status==='SUSPENDED'?'ACTIVE':'SUSPENDED';msg=t.brand+' '+t.status}
 else if(type==='invoice'){const i=db.invoices.find(x=>x.id===value('ux-id'));if(!i)return;i.status='FAILED';msg='Invoice '+i.id+' gagal dibayar'}
 else if(type==='grant'){const ticket=required('ux-ticket','Ticket');if(!ticket)return;const t=value('ux-tenant'),g=h.grants.find(x=>x.tenant===t&&x.ticket===ticket&&x.status==='ACTIVE');if(g){g.status='REVOKED';msg='Grant dicabut untuk '+ticket}else{h.grants.push({ticket,tenant:t,status:ui.role==='support'?'REQUESTED':'ACTIVE',minutes:Number(value('ux-duration')),at:now()});msg=(ui.role==='support'?'Request':'Grant')+' support untuk '+ticket}}
 else if(type==='ticket'){const title=required('ux-reason','Judul');if(!title)return;h.tickets.push({id:uid('SUP'),title,severity:value('ux-severity'),status:'NEW',at:now()});msg='Support ticket dibuat: '+title}
 else if(type==='diagnostic')msg='Diagnostic metadata checked, payload redacted';

 else if(type==='invite'){const email=required('ux-email','Email');if(!email||!/^\S+@\S+\.\S+$/.test(email)){toast('Email tidak valid',true);return}h.workflow.push({id:uid('invite'),tenant:ui.tenant,role:ui.role,type:'invite',detail:'Staff invited '+email+' · '+value('ux-outlet')+' · '+value('ux-staff-role'),time:now()});msg='Invitation draft dibuat'}

 else if(type==='delivery-exception'){const o=ord();if(!o||o.method!=='delivery'||!reason())return;o.delivery=value('ux-exception');if(o.delivery==='RETURN_TO_OUTLET')o.courier=null;msg=o.id+' '+o.delivery+' · '+value('ux-reason')}
 else if(type==='reject'){const o=ord();if(!o||!o.courier||!reason())return;o.courier=null;o.delivery='READY_FOR_ASSIGNMENT';msg='Courier rejected '+o.id}

 else return;
 log(type,msg);render();toast(msg)
}

function productOperations(){const t=tenantOps.tab,arr=tp().filter(p=>!tenantOps.filters.q||`${p.name} ${p.sku} ${p.category}`.toLowerCase().includes(tenantOps.filters.q.toLowerCase()));const tabs=[['products','Daftar Produk'],['categories','Kategori & SKU'],['variants','Varian & Modifier'],['pricing','Harga & Margin'],['suppliers','Supplier & Stok'],['publishing','Publikasi & Audit']];let body='';if(t==='products')body=`<div class="ops-toolbar"><input placeholder="Cari nama / SKU / kategori" value="${esc(tenantOps.filters.q)}" oninput="tenantOps.filters.q=this.value;render()"><button class="btn primary" onclick="openOpsProduct()">+ Tambah produk</button></div><div class="ops-scroll"><table class="table"><thead><tr><th>Produk / SKU</th><th>Kategori</th><th>Harga</th><th>HPP</th><th>Margin kotor*</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${arr.map(p=>{const m=productMeta(p);return `<tr><td><b>${esc(p.name)}</b><div class="subtext">${esc(p.sku)} · ${esc(m.unit)}</div></td><td>${esc(p.category)}</td><td>${fmt(p.price)}</td><td>${fmt(m.cost)}</td><td>${p.price?((p.price-m.cost)/p.price*100).toFixed(1):0}%</td><td>${p.stock} <span class="subtext">/ min ${m.minStock}</span></td><td>${tag(m.visibility==='published'?'PUBLISHED':'DRAFT',m.visibility==='published'?'green':'amber')}</td><td><button class="btn outline sm" onclick="openOpsProduct('${p.id}')">Kelola</button></td></tr>`}).join('')}</tbody></table></div>`;

function openOpsProduct(id){if(!opsRole('owner','brand'))return toast('Mode baca saja untuk role ini',true);tenantOps.pEdit=id||null;const p=id?tp().find(x=>x.id===id):null,m=p?productMeta(p):{};const ed=document.getElementById('ops-modal');if(!ed)return;ed.innerHTML=`<div class="ops-cover"><div class="ops-dialog"><div class="between"><h2>${p?'Edit produk':'Tambah produk'}</h2><button class="btn ghost" onclick="document.getElementById('ops-modal').innerHTML=''">Tutup ✕</button></div><div class="ops-grid">${opsField('op-name','Nama produk',p?.name||'')}${opsField('op-sku','SKU unik',p?.sku||'')}${opsField('op-category','Kategori',p?.category||'Umum')}${opsField('op-barcode','Barcode',m.barcode||'')}${opsField('op-price','Harga jual (Rp)',p?.price||0,'number','min="0"')}${opsField('op-cost','HPP per unit (Rp)',m.cost||0,'number','min="0"')}${opsField('op-stock','Stok awal / demo',p?.stock||0,'number','min="0"')}${opsField('op-min','Minimum stok',m.minStock??10,'number','min="0"')}${opsField('op-unit','Satuan',m.unit||'pcs')}${opsField('op-supplier','Supplier',m.supplier||'')}${opsSelect('op-type','Tipe',[['physical','Fisik'],['service','Jasa'],['digital','Digital']],m.type||'physical')}${opsSelect('op-status','Visibilitas',[['published','Published'],['draft','Draft']],m.visibility||'draft')}</div><label class="ops-field"><span>Deskripsi produk</span><textarea id="op-desc">${esc(p?.desc||'')}</textarea></label><div class="ops-grid"><label class="ops-field"><span>Varian (pisahkan koma, contoh: Small, Medium, Large)</span><textarea id="op-variants">${esc((m.variants||[]).join(', '))}</textarea></label><label class="ops-field"><span>Modifier (contoh: Extra shot, Oat milk)</span><textarea id="op-modifiers">${esc((m.modifiers||[]).join(', '))}</textarea></label></div><div class="notice">Demo menyimpan varian sebagai opsi metadata. Kombinasi SKU, inventory per varian, gambar, dan price override wajib diimplementasikan saat engineering.</div><button class="btn primary" onclic function saveOpsProduct(){if(!opsRole('owner','brand'))return toast('Tidak diizinkan',true);const v=id=>document.getElementById(id)?.value?.trim()||'',name=v('op-name'),sku=v('op-sku'),price=Number(v('op-price')),cost=Number(v('op-cost')),stock=Number(v('op-stock')),min=Number(v('op-min'));if(!name||!sku||[price,cost,stock,min].some(n=>!Number.isFinite(n)||n<0)||!Number.isInteger(stock)||tp().some(p=>p.sku.toLowerCase()===sku.toLowerCase()&&p.id!==tenantOps.pEdit)){toast('Periksa nama, SKU unik dan angka tidak negatif.',true);return}let p=tp().find(x=>x.id===tenantOps.pEdit);if(!p){p={id:uid('p'),tenant:ui.tenant,art:'coffee'};db.products.push(p)}Object.assign(p,{name,sku,category:v('op-category'),price,stock,desc:v('op-desc')});db.productMeta[p.id]={...productMeta(p),cost,minStock:min,barcode:v('op-barcode'),unit:v('op-unit'),supplier:v('op-supplier'),type:v('op-type'),visibility:v('op-status'),variants:v('op-variants').split(',').map(x=>x.trim()).filter(Boolean),modifiers:v('op-modifiers').split(',').map(x=>x.trim()).filter(Boolean)};act(`Product ${sku} updated`,'catalog');document.getElementById('ops-modal').innerHTML='';render();toast('Produk tersimpan')}

function c22CSVparse(s){const lines=[];let row=[],field='',quoted=false;for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='"'){if(quoted&&s[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(field);field='';if(row.some(x=>x.trim()))lines.push(row);row=[]}else field+=ch}row.push(field);if(row.some(x=>x.trim()))lines.push(row);return lines}
async function c22ReadCSV(f){if(!f)return;if(f.size>1024*1024)return c22Alert('CSV maksimum 1 MB',true);const txt=await f.text(),rows=c22CSVparse(txt),header=rows.shift()?.map(x=>x.trim().toLowerCase());if(!header||['name','sku','category','price','cost','stock'].some(x=>!header.includes(x)))return c22Alert('Header CSV tidak sesuai template',true);const existing=new Set(tp().flatMap(p=>[p.sku.toLowerCase(),...(productMeta(p).skuVariants||[]).map(v=>v.sku.toLowerCase())]));const seen=new Set();c22.preview=rows.slice(0,300).map(r=>{const x=Object.fromEntries(header.map((h,i)=>[h,(r[i]||'').trim()])),n=[x.price,x.cost,x.stock].map(Number),key=(x.sku||'').toLowerCase();x.error=!x.name||!key?'Nama/SKU kosong':existing.has(key)||seen.has(key)?'SKU duplikat':n.some(v=>!Number.isSafeInteger(v)||v<0)?'Angka tidak valid':'';seen.add(key);return x});c22.fileName=f.name;render()}

ivery||'-'),fmt(o.deliveryFee||0),detail(o.id)]);break;case 'payments':heads=['Payment','Order','Total'];rows=[...new Set(orders.map(o=>o.payment))].map(k=>[esc(k),String(orders.filter(o=>o.payment===k).length),fmt(orders.filter(o=>o.payment===k).reduce((n,o)=>n+o.total,0))]);break;case 'customers':heads=['Pelanggan','Order','Total'];rows=[...new Set(orders.map(o=>o.customer))].map(k=>[esc(k),String(orders.filter(o=>o.customer===k).length),fmt(orders.filter(o=>o.customer===k).reduce((n,o)=>n+o.total,0))])}return page('Reports Detail · Phase 2.2C','Filter aktif, KPI terfilter, drilldown order/expense, dan tabel per dimensi.')+`<div class="ops-toolbar"><label>Dari<input type="date" id="c22-from" value="${esc(c22.from)}"></label><label>Sampai<input type="date" id="c22-to" value="${esc(c22.to)}"></label><label>Channel<select id="c22-channel"><option value="all">Semua</option>${['POS','Storefront'].map(x=>`<option ${c22.channel===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Status bayar<select id="c22-pay"><option value="all">Semua</option>${[...new Set(to().map(o=>o.payment))].map(x=>`<option ${c22.pay===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><button class="btn primary" onclick="c22ApplyReport()">Terapkan filter</button><button class="btn outline" onclick="c22ExportReport()">Export CSV terfilter</button><button class="btn ghost" onclick="c22.from='';c22.to='';c22.channel='all';c22.pay='all';render()">Reset</button></div><div class="stats-grid">${stat('Paid sales*',fmt(revenue),'wallet')}${stat('Paid expenses',fmt(cost),'receipt')}${stat('Order terfilter',orders.length,'shopping')}${stat('Pending expenses',expenses.filter(e=>e.status==='PENDING').length,'alert')}</div>${opsTabs(c22ReportTabs,tenantOps.rep,'setReportsTab')}${c22Table(heads,rows)}<div id="ops-modal"></div><div class="notice warn">Data simulasi dan angka estimasi. Filter tanggal menggunakan createdAt/date ketika tersedia; order lama tanpa timestamp diperlakukan bertanggal hari ini. Inventory adalah snapshot saat ini, bukan histori as-of-date.</div>`}

eserved','Available'],all.map(x=>[esc(x.v?.sku||x.p.sku),String(e22Qty(x.p.id,x.v?.id)),String(e22Reserved(x.p.id,x.v?.id)),String(e22Available(x.p.id,x.v?.id))]))}<h3 style="margin-top:20px">Reservasi aktif</h3>${c22Table(['SKU','Qty','Order','Status','Aksi'],db.stockReservations.filter(r=>r.tenant===ui.tenant).slice(-12).reverse().map(r=>[esc(r.sku),r.qty,esc(r.orderRef||'—'),tag(r.status),r.status==='ACTIVE'?`<button class="btn sm outline" onclick="e22Release('${r.id}')">Release</button>`:'—']))}</div></div>`}

function e22CodTotal(){let ids=[...document.querySelectorAll('.e-cod-check:checked')].map(x=>x.value),amt=ids.reduce((s,id)=>s+(e22Find(id)?.total||0),0);let e=document.getElementById('e-cod-total');if(e)e.textContent=fmt(amt);let a=document.getElementById('e-cod-amount');if(a)a.value=amt}

nt:space-between;align-items:start;gap:10px"><div><div style="font-size:12px;color:#64748b">Lokasi outlet</div><div style="font-size:13px;font-weight:700;color:#0f172a;margin-top:4px">${esc(address)}</div><div style="font-size:11px;color:#64748b;margin-top:6px">${esc(p.contact||'Nomor telepon belum diisi')}</div></div><button style="border:0;background:#eef4ff;color:#315fe1;padding:8px 10px;border-radius:12px;font-size:11px;font-weight:800">Lihat map</button></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${chips}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div style="background:#fff;border:1px solid #e5edf7;border-radius:18px;padding:14px"><div style="font-size:12px;color:#64748b">Jam operasional</div><div style="margin-top:8px">${profileWeekRows(p)}</div></div><div style="background:#fff;border:1px solid #e5edf7;border-radius:18px;padding:14px"><div style="font-size:12px;color:#64748b">Call to action</div><div style="display:grid;gap:8px;margin-top:12px"><button style="border:0;background:#315fe1;color:#fff;padding:11px;border-radius:14px;font-size:12px;font-weight:800">Pesan sekarang</button><button style="border:1px solid #dbe5f1;background:#fff;color:#0f172a;padding:11px;border-radius:14px;font-size:12px;font-weight:700">Pickup ke toko</button></div><div style="font-size:10px;color:#94a3b8;margin-top:12px">Preview ini mensimulasikan tampilan mobile storefront pelanggan.</div></div></div>`;}
function profileAttachLivePreview(){const ids=['sp-name','sp-contact','sp-email','sp-street','sp-landmark','sp-district','sp-city','sp-province','sp-postal','sp-lat','sp-lon','sp-pickup','sp-delivery'];ids.forEach(id=>{const el=document.getElementById(id);if(el&&!el.dataset.livebound){['input','change'].forEach(evt=>el.addEventListener(evt,profileLivePreview));el.dataset.livebound='1';}});WEEKDAYS.forEach(d=>['closed','open','close'].forEach(kind=>{const el=document.getElementById(`sp-${d.key}-${kind}`);if(el&&!el.dataset.livebound){['input','change'].forEach(evt=>el.addEventListener(evt,profileLivePreview));el.dataset.livebound='1';}}));profileLivePreview();}

function profilePreviewMap(){const lat=Number(document.getElementById('sp-lat').value),lon=Number(document.getElementById('sp-lon').value);if(!document.getElementById('sp-lat').value||!document.getElementById('sp-lon').value||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){toast('Koordinat tidak valid.',true);return}document.getElementById('sp-map').innerHTML=`<iframe title="Pratinjau titik outlet" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:250px;border:0;border-radius:12px" src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-.007}%2C${lat-.005}%2C${lon+.007}%2C${lat+.005}&layer=mapnik&marker=${lat}%2C${lon}"></iframe>`}
function profileSave(){if(!['owner','brand','manager'].includes(ui.role)){toast('Role ini tidak memiliki izin mengubah profil outlet.',true);return}const o=db.outlets.find(x=>x.id===selectedProfileOutlet&&x.tenant===ui.tenant);if(!o)return;const get=id=>document.getElementById('sp-'+id)?.value.trim()||'';const lat=get('lat'),lon=get('lon');if(!get('name')||!get('street')||!get('city')||!get('province')){toast('Nama toko, jalan, kota dan provinsi wajib diisi.',true);return}if((lat&&!lon)||(!lat&&lon)||lat&&(Math.abs(Number(lat))>90||Math.abs(Number(lon))>180||!Number.isFinite(Number(lat))||!Number.isFinite(Number(lon)))){toast('Latitude dan longitude harus diisi berpasangan dengan nilai valid.',true);return}if(get('email')&&!/^\S+@\S+\.\S+$/.test(get('email'))){toast('Format email tidak valid.',true);return}const hours={};for(const [k] of PROFILE_DAYS){const closed=document.getElementById('sp-'+k+'-closed').checked,open=get(k+'-open'),close=get(k+'-close');if(!closed&&(!open||!close||open===close)){toast('Jam buka dan tutup harus berbeda untuk hari aktif.',true);return}hours[k]={closed,open,close}}db.storeProfiles||={};db.storeProfiles[o.id]={logo:profilePendingLogo,businessName:get('name'),contact:get('contact'),email:get('email'),street:get('street'),detail:get('detail'),district:get('district'),city:get('city'),province:get('province'),postal:get('postal'),latitude:lat,longitude:lon,timezone:'Asia/Jakarta',hours,pickup:document.getElementById('sp-pickup').checked,delivery:document.getElementById('sp-delivery').checked,notes:get('notes')};o.name=get('name');o.address=[get('street'),get('district'),get('city'),get('province')].filter(Boolean).join(', ');try{save()}catch(e){toast('Penyimpanan browser gagal, coba logo dengan ukuran lebih kecil.',true);return}toast('Profil outlet berhasil disimpan.');render()}

const SB_SECTIONS=[['voucher','Voucher & Kupon'],['banner','Banner Promosi'],['flash','Flash Sale'],['limited','Stok Terbatas'],['best','Best Seller'],['new','Produk Terbaru'],['bundle','Paket Produk'],['products','Semua Produk'],['reviews','Ulasan Pelanggan'],['social','Media Sosial'],['footer','Orbis Footer Logo'],['wa','Tombol WhatsApp'],['share','Tombol Bagikan']];
const SB_DEFAULT={heroTitle:'',heroSubtitle:'Belanja lebih praktis, ambil di outlet atau kirim ke rumah.',heroLogo:'',heroImage:'',bannerImage:'',bannerText:'PROMO SPESIAL PEKAN INI',deliveryEta:'30–60 menit',trustAddress:true,trustHours:true,trustDelivery:true,trustSecure:true,showRating:true,showSold:true,sections:Object.fromEntries(SB_SECTIONS.map(s=>[s[0],true])),socialInstagram:'',socialTikTok:'',socialFacebook:'',waNumber:'',featuredLabel:'Pilihan terbaik untukmu'};
let sbDraft=null,sbSelectedTenant=null,sbDeviceTab='home';
function sbConfig(t){return {...SB_DEFAULT,...(t.storeBuilder||{}),sections:{...SB_DEFAULT.sections,...(t.storeBuilder?.sections||{})}}}
function sbCurrent(){if(sbSelectedTenant!==ui.tenant||!sbDraft){sbSelectedTenant=ui.tenant;sbDraft=structuredClone(sbConfig(tenant()))}return sbDraft}
function sbSet(path,val){const d=sbCurrent();if(path.startsWith('sections.'))d.sections[path.slice(9)]=val;else d[path]=val;sbPreview()}
function sbField(label,key,hint='',type='text'){const d=sbCurrent();return `<label style="display:block;margin:10px 0;color:#334155;font-size:12px;font-weight:700">${label}<input class="input" style="width:100%;margin-top:5px" type="${type}" value="${esc(d[key]||'')}" placeholder="${esc(hint)}" oninput="sbSet('${key}',this.value)"></label>`}
function sbSwitch(label,key,desc=''){const d=sbCurrent(),value=key.startsWith('sections.')?d.sections[key.slice(9)]:d[key];return `<label style="display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #edf2f7;padding:10px 0;cursor:pointer"><span><b style="font-size:12px">${label}</b>${desc?`<span class="subtext" style="display:block;margin-top:3px">${desc}</span>`:''}</span><span style="position:relative;display:inline-flex;align-items:center;flex-shrink:0"><input type="checkbox" ${value?'checked':''} onchange="sbSet('${key}',this.checked)" style="accent-color:#315fe1;width:20px;height:20px;cursor:pointer" aria-label="${label}"></span></label>`}
function sbUpload(input,key){const f=input.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>1048576){toast('Gunakan PNG/JPG/WebP maksimal 1 MB',true);input.value='';return}const r=new FileReader();r.onload=()=>{sbSet(key,String(r.result));sbRefreshEditorImage(key)};r.readAsDataURL(f)}
function sbRefreshEditorImage(key){const el=document.getElementById('sb-img-'+key);if(el)el.innerHTML=sbCurrent()[key]?`<img src="${sbCurrent()[key]}" style="width:100%;max-height:85px;object-fit:contain;border-radius:10px" alt="Preview ${key}">`:'Belum ada gambar'}
function sbImageControl(label,key){const d=sbCurrent();return `<div style="border:1px solid #e6edf5;border-radius:14px;padding:11px;margin:10px 0"><b style="font-size:12px">${label}</b><div id="sb-img-${key}" style="margin:9px 0;background:#f8fafc;min-height:44px;display:grid;place-items:center;color:#94a3b8;font-size:11px;border-radius:10px">${d[key]?`<img src="${d[key]}" style="width:100%;max-height:85px;object-fit:contain;border-radius:10px" alt="${label}">`:'Belum ada gambar'}</div><div style="display:flex;flex-wrap:wrap;gap:8px"><label class="btn outline sm" style="cursor:pointer">Upload <input type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="sbUpload(this,'${key}')"></label><button class="btn outline sm" onclick="sbSet('${key}','');sbRefreshEditorImage('${key}')">Hapus</button></div><div class="subtext" style="margin-top:5px">PNG/JPG/WebP, maksimal 1 MB per file (demo).</div></div>`}
function sbSave(){const d=sbCurrent();tenant().storeBuilder=structuredClone(d);try{save()}catch(e){toast('Gagal menyimpan: kapasitas browser penuh. Kecilkan gambar.',true);return}act('Storefront builder diperbarui','store');toast('Konfigurasi storefront tersimpan');sbPreview()}
function sbReset(){sbDraft=structuredClone(sbConfig(tenant()));render();toast('Perubahan draft dibatalkan')}
function sbHours(){const o=db.outlets.find(x=>x.tenant===ui.tenant),p=o?profileOf(o):null;const hrs=p?.hours;let str='08.00–22.00';if(Array.isArray(hrs)){const h=hrs.find(x=>x.day===['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()]);if(h)str=h.closed?'Tutup hari ini':`${h.open}–${h.close}`}else if(hrs&&typeof hrs==='object'){const k=['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()];const h=hrs[k];if(h)str=h.closed?'Tutup hari ini':`${h.open}–${h.close}`}return {address:p?.street||o?.address||'Alamat belum diisi',hours:str,logo:p?.logo||''}}
function sbProductCard(p,i,d,t,interactive=false){const count=12+i*27;const stars=(4.7+(i%3)*.1).toFixed(1);const discount=i%3===0?'<span style="position:absolute;top:7px;left:7px;background:#fff1f2;color:#e11d48;font-size:9px;font-weight:800;padding:4px 6px;border-radius:5px">PROMO</span>':'';return `<div style="min-width:0;border:1px solid #e9edf4;border-radius:13px;background:white;overflow:hidden"><div style="height:84px;background:linear-gradient(135deg,#eef4ff,#f4f7fa);display:grid;place-items:center;font-size:36px;position:relative">${PICT[p.art]||'📦'}${discount}</div><div style="padding:9px"><b style="font-size:10px;display:block;line-height:1.4;min-height:27px">${esc(p.name)}</b><b style="display:block;font-size:11px;color:${esc(t.accent)};margin:4px 0">${fmt(p.price)}</b>${d.showRating?`<div style="font-size:9px;color:#f59e0b">★ ${stars} <span style="color:#94a3b8">(${count})</span></div>`:''}${d.showSold?`<div style="font-size:9px;color:#64748b;margin-top:2px">${count*3} terjual</div>`:''}${interactive?`<button style="background:#315fe1;color:white;border:0;border-radius:8px;padding:6px 9px;font-size:10px;font-weight:800;margin-top:7px;width:100%" onclick="addCart('store','${p.id}')">+ Keranjang</button>`:''}</div></div>`}
function sbRenderStore(d,t,interactive=false){const products=db.products.filter(p=>p.tenant===t.id);const info=sbHours();const section=d.sections;const productCards=(count=4)=>`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px">${products.slice(0,count).map((p,i)=>sbProductCard(p,i,d,t,interactive)).join('')||'<div style="font-size:11px;color:#64748b">Belum ada produk.</div>'}</div>`;const sect=(title,body)=>`<section style="margin:15px 0"><h4 style="font-size:13px;color:#0f172a;margin:0 0 8px;font-weight:900">${title}</h4>${body}</section>`;return `<div style="font:12px/1.45 Inter,Arial,sans-serif;color:#0f172a;background:#f8fafc;min-height:100%"><div style="background:white;display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border-bottom:1px solid #edf2f7"><div style="display:flex;gap:8px;align-items:center">${(d.heroLogo||info.logo)?`<img src="${d.heroLogo||info.logo}" style="width:30px;height:30px;object-fit:contain;border-radius:8px" alt="Logo">`:`<div style="width:30px;height:30px;background:${esc(t.color)};border-radius:9px;display:grid;place-items:center;color:white;font-weight:900">${esc(t.brand?.[0]||'T')}</div>`}<div><b style="font-size:12px">${esc(t.brand)}</b><div style="font-size:9px;color:#64748b">${esc(t.outlet||'Online Store')}</div></div></div><span style="font-size:18px">☰</span></div><div style="padding:12px"><div style="border-radius:17px;overflow:hidden;color:#fff;background:${esc(t.color)};position:relative;min-height:158px;display:flex;align-items:end">${d.heroImage?`<img src="${d.heroImage}" style="position:absolute;width:100%;height:100%;inset:0;object-fit:cover;opacity:.48" alt="Hero toko">`:''}<div style="position:relative;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.35));width:100%"><div style="font-size:9px;opacity:.8;letter-spacing:.08em">SELAMAT DATANG</div><div style="font-size:20px;font-weight:900;line-height:1.12;margin:6px 0">${esc(d.heroTitle||t.tagline||t.brand)}</div><div style="font-size:10px;opacity:.92">${esc(d.heroSubtitle)}</div><span style="display:inline-block;margin-top:11px;background:white;color:#1e293b;border-radius:8px;padding:7px 11px;font-size:10px;font-weight:800">Belanja Sekarang →</span></div></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:9px">${d.trustAddress?`<div style="background:#fff;padding:9px;border-radius:9px;font-size:9px">📍 <b>Alamat toko</b><div style="color:#64748b;margin-top:3px">${esc(info.address).slice(0,62)}</div></div>`:''}${d.trustHours?`<div style="background:#fff;padding:9px;border-radius:9px;font-size:9px">🕘 <b>Jam operasional</b><div style="color:#64748b;margin-top:3px">${esc(info.hours)}</div></div>`:''}${d.trustDelivery?`<div style="background:#fff;padding:9px;border-radius:9px;font-size:9px">🛵 <b>Estimasi delivery</b><div style="color:#64748b;margin-top:3px">${esc(d.deliveryEta)}</div></div>`:''}${d.trustSecure?`<div style="background:#fff;padding:9px;border-radius:9px;font-size:9px">🛡️ <b>Transaksi aman</b><div style="color:#64748b;margin-top:3px">Checkout merchant</div></div>`:''}</div>${section.voucher?sect('Voucher untukmu',`<div style="background:#ecfdf5;border:1px dashed #10b981;border-radius:12px;padding:12px"><b style="color:#047857">HEMAT10 · Diskon 10%</b><div style="color:#64748b;font-size:10px;margin-top:3px">Gunakan saat checkout · Simulasi</div></div>`):''}${section.banner?sect('Promo Spesial',`<div style="background:#fff0e6;border-radius:12px;overflow:hidden;position:relative">${d.bannerImage?`<img src="${d.bannerImage}" style="width:100%;height:100px;object-fit:cover" alt="Banner promo">`:''}<div style="padding:13px;font-weight:900;color:#c2410c">🎁 ${esc(d.bannerText)}</div></div>`):''}${section.flash?sect('⚡ Flash Sale',`<div style="background:#fff1f2;border-radius:9px;padding:9px;font-size:11px;color:#be123c;font-weight:800">Berakhir dalam 02:14:09 · Timer demo</div>${productCards(2)}`):''}${section.limited?sect('🔥 Stok Terbatas',productCards(2)):''}${section.best?sect('🏆 Best Seller',productCards(2)):''}${section.new?sect('✨ Produk Terbaru',productCards(2)):''}${section.bundle?sect('Paket Hemat',`<div style="padding:13px;background:white;border:1px solid #e5e7eb;border-radius:12px"><b>☕ Paket Favorit</b><div style="font-size:10px;color:#64748b;margin-top:5px">Gabungkan produk pilihan untuk hemat lebih banyak.</div></div>`):''}${section.products?sect('Semua Produk',productCards(6)):''}${section.reviews?sect('Ulasan Pelanggan',`<div style="background:white;border-radius:12px;padding:13px"><b>★★★★★</b><div style="font-size:10px;margin-top:5px;color:#475569">“Pesanannya cepat, produknya oke!”</div><div style="font-size:9px;color:#94a3b8;margin-top:7px">Contoh ulasan · bukan testimoni terverifikasi</div></div>`):''}${section.social?sect('Ikuti Kami',`<div style="font-size:11px;display:flex;gap:8px;flex-wrap:wrap">${d.socialInstagram?'📸 Instagram ':''}${d.socialTikTok?'♪ TikTok ':''}${d.socialFacebook?'f Facebook ':''}${!d.socialInstagram&&!d.socialTikTok&&!d.socialFacebook?'Hubungkan akun media sosial di pengaturan.':''}</div>`):''}${section.footer?`<div style="text-align:center;padding:21px 0;color:#94a3b8;font-size:10px;border-top:1px solid #e5e7eb;margin-top:20px">Powered by <b style="color:#1d4ed8;font-size:13px">◈ orbis.</b><div>Storefront commerce platform</div></div>`:''}</div>${section.wa?`<div style="position:sticky;bottom:54px;text-align:right;padding:0 12px;pointer-events:none"><span style="display:inline-grid;place-items:center;border-radius:100%;background:#16a34a;color:white;width:37px;height:37px;font-size:17px;box-shadow:0 6px 16px #0002">✆</span></div>`:''}${section.share?`<div style="position:sticky;bottom:8px;text-align:right;padding:0 12px;pointer-events:none"><span style="display:inline-grid;place-items:center;border-radius:100%;background:#315fe1;color:white;width:37px;height:37px;font-size:17px;box-shadow:0 6px 16px #0002">↗</span )}`)}${panel('Publikasi & Tema','Tema tenant dipakai untuk storefront dan preview.',`<div class="subtext">Domain demo: ${esc(t.slug)}.orbis.demo</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:13px">${[['Navy','#20365a','#446ff4'],['Emerald','#0d5d53','#149780'],['Sunset','#813e47','#ed865f'],['Midnight','#24253f','#8e79de']].map(a=>`<button class="btn outline sm" onclick="chooseTheme('${a[1]}','${a[2]}')">${a[0]}</button>`).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px">${btn('Batalkan Draft','sbReset()','outline')}${btn('Simpan Konfigurasi','sbSave()','primary')}</div>` )}</div>` ;setTimeout(sbPreview,0);return page('Toko Online & Branding','Atur konten dan susunan halaman toko dengan preview smartphone yang live.',btn('Lihat halaman pelanggan',"openStore(ui.tenant)",'outline')+btn('Simpan Perubahan','sbSave()','primary'))+`<div class="sb-builder"><div style="min-width:0">${settings}</div><div class="sb-right"><div class="panel panelpad"><div class="between" style="margin-bottom:10px"><div><b>Live Mobile Storefront</b><div class="subtext">Preview draft · Belum dipublikasikan</div></div>${tag('360px','slate')}</div><div class="sb-phone"><div class="sb-camera"></div><div class="sb-screen" id="sb-live-preview"></div><div class="sb-homebar"></div></div><div class="subtext" style="text-align:center;margin-top:12px">Scroll di dalam frame untuk melihat seluruh section</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">${btn('Simpan','sbSave()','primary')}${btn('Buka Storefront',"openStore(ui.tenant)",'outline')}</div></div></div></div>`};

n class="btn ghost sm" ${!qty?'disabled':''} onclick="posxClearCart()">${icon('trash',13)} Kosongkan</button></div></div><div class="posx-cart-scroll">${cartRows||`<div class="posx-empty">${icon('shopping',30)}<h4 style="margin:13px 0 6px;color:#34405a">Keranjang masih kosong</h4><p style="font-size:12px">Pilih produk dari katalog untuk memulai transaksi.</p></div>`}</div><div class="posx-cart-totals"><div class="between"><span class="posx-label">Subtotal</span><b>${fmt(total)}</b></div><div class="between" style="margin-top:12px"><span class="posx-label">Diskon</span><span class="posx-label">Belum diterapkan</span></div><div class="sep" style="margin:15px 0"></div><div class="posx-total"><span style="font-weight:800">Total Pembayaran</span><strong>${fmt(total)}</strong></div><button class="btn primary block lg" onclick="openModal('posPay')" ${!shift||!qty?'disabled':''}>${icon('card',17)} Lanjut Pembayaran ${icon('arrow',14)}</button><div class="posx-helper">${icon('shield',13)} Harga dan stok SKU divalidasi lagi saat checkout. Pembayaran masih simulasi dan diskon belum terhubung ke transaksi.</div><div style="display:flex;gap:7px;margin-top:12px"><button class="btn outline sm" style="flex:1" onclick="navigate('promotions')">${icon('tag',13)} Promo</button><button class="btn outline sm" style="flex:1" onclick="navigate('orders')">${icon('receipt',13)} Order</button></div></div></div></aside></div><div class="posx-mobile-pay"><div><div class="posx-label">${qty} item · Total</div><b style="font-size:17px;color:#214ab0">${fmt(total)}</b></div><button class="btn primary" ${!shift||!qty?'disabled':''} onclick="openModal('posPay')">Bayar ${icon('arrow',13)}</button></div>`;
}
// Correct modal total for SKU variants, including variant-specific price.
const posxPreviousRenderModal=renderModal;
renderModal=function(){const html=posxPreviousRenderModal();if(ui.modal?.type!=='posPay')return html;const total=ui.posCart.reduce((sum,i)=>sum+(d22Cart(i)?.price||0)*i.qty,0);return html.replace(/(<div class="pay-total"><b>Total<\/b><b>)[\s\S]*?(<\/b><\/div>)/,'$1'+fmt(total)+'$2')};

<script id="posk-functional">
/* Phase 2.2K: validated cashier operations and tenant membership demo, no backend */
(function(){
  if(!Array.isArray(db.posShiftHistory))db.posShiftHistory=[];
  if(!Array.isArray(db.posCashEvents))db.posCashEvents=[];
  if(!Array.isArray(db.posHeldCarts))db.posHeldCarts=[];
  if(!Array.isArray(db.memberAccounts))db.memberAccounts=[];
  if(!Array.isArray(db.memberPointLedger))db.memberPointLedger=[];
  if(!db.posShiftOpen || typeof db.posShiftOpen!=='object')db.posShiftOpen={};
  if(!db.memberSettings || typeof db.memberSettings!=='object')db.memberSettings={};
  NAVITEMS.posOperations=['pos-operations','Operasional POS','wallet'];
  NAVITEMS.membership=['membership','Membership & Poin','users'];
  const rolesOps=['owner','manager','cashier','finance'];
  const rolesMember=['owner','manager','brand','cashier','cs'];
  for(const r of rolesOps){let g=ROLE_NAV[r].find(x=>x.name.includes('Kasir')||x.name.includes('Penjualan')||x.name.includes('Outlet')||x.name.includes('Keuangan'))||ROLE_NAV[r][0];if(!g.items.some(x=>x[0]==='pos-operations'))g.items.push(NAVITEMS.posOperations)}
  for(const r of rolesMember){let g=ROLE_NAV[r].find(x=>x.name.includes('Pelanggan')||x.name.includes('Kasir')||x.name.includes('Penjualan')||x.name.includes('Pemasaran'))||ROLE_NAV[r][0];if(!g.items.some(x=>x[0]==='membership'))g.items.push(NAVITEMS.membership)}
  // The workspace keeps independent state for each tenant and main outlet.
  const pkCurrentOutlet=()=>db.outlets.find(x=>x.tenant===ui.tenant)?.id||'default';
  const pkKey=()=>ui.tenant+'|'+pkCurrentOutlet();
  const pkShift=()=>db.posShiftOpen[pkKey()]||null;
  const pkActive=()=>pkShift()?.status==='OPEN';
  const pkCanManage=()=>['owner','manager'].includes(ui.role);
  const pkCanCash=()=>['owner','manager','cashier'].includes(ui.role);
  const pkOwned=()=>db.memberAccounts.filter(x=>x.tenant===ui.tenant);
  const pkMember=(id)=>pkOwned().find(x=>x.id===id);
  const pkPolicy=()=>db.memberSettings[ui.tenant]||{enabled:true,earnUnit:10000,redeemValue:100,maxPercent:20};
  const pkPts=(id)=>db.memberPointLedger.filter(x=>x.tenant===ui.tenant&&x.memberId===id).reduce((s,x)=>s+x.points,0);
  const pkTier=(id)=>{const m=pkMember(id);const spent=Number(m?.lifetimeSpend||0);return spent>=3000000?'Gold':spent>=1000000?'Silver':'Bronze'};
  const pkMoney=(v)=>fmt(Math.round(Number(v)||0));
  const pkHist=()=>db.posShiftHistory.filter(x=>x.tenant===ui.tenant&&x.outlet===pkCurrentOutlet()).slice().reverse();
  const pkEvents=()=>db.posCashEvents.filter(x=>x.tenant===ui.tenant&&x.shiftId===pkShift()?.id);
  const pkOrders=()=>db.orders.filter(x=>x.tenant===ui.tenant&&x.source==='POS'&&x.shiftId===pkShift()?.id&&['PAID','PARTIALLY_REFUNDED','REFUNDED'].includes(x.payment)&&x.status!=='CANCELLED');
  const pkSales=()=>pkOrders().reduce((sum,o)=>sum+(Array.isArray(o.paymentLegs)?o.paymentLegs.filter(l=>l.method==='cash').reduce((a,l)=>a+Number(l.amount||0),0):(o.paymentType==='cash'?Number(o.total||0):0)),0);
  const pkRefundCash=()=>db.posCashRefundMovements.filter(x=>x.tenant===ui.tenant&&x.shiftId===pkShift()?.id).reduce((s,x)=>s+Number(x.amount||0),0);
  const pkExpected=()=>Number(pkShift()?.opening||0)+pkSales()+pkEvents().reduce((s,e)=>s+(e.type==='IN'?1:-1)*e.amount,0)+pkRefundCash();
  const pkText=(id)=>document.getElementById(id)?.value?.trim()||'';
  const pkNumber=(id)=>Number(document.getElementById(id)?.value);
  const pkValidMoney=(a)=>Number.isSafeInteger(a)&&a>=0&&a<=1000000000;
  const pkNoteEvent=(text)=>{db.events.unshift({id:uid('ev'),tenant:ui.tenant,text,at:now(),time:now(),type:'pos'});};
  const pkWarn=(message)=>toast(message,true);
  const pkSave=()=>{save();render()};
  const pkInitMember=()=>{if(!pkOwned().length && ui.tenant==='t1'){const id='MEM-DEMO-'+ui.tenant;db.memberAccounts.push({id,tenant:ui.tenant,name:'Nadia Putri',phone:'081234568901',email:'',joined:now(),lifetimeSpend:650000,consent:true,status:'ACTIVE'});db.memberPointLedger.push({id:uid('pt'),tenant:ui.tenant,memberId:id,points:65,type:'OPENING_DEMO',ref:'SEED',at:now()});save()}};
  pkInitMember();
  window.pkGo=(route)=>navigate(route);
  window.pkStartDialog=()=>{if(!pkCanCash())return pkWarn('Akses kasir tidak diberikan');if(pkActive())return pkWarn('Shift sudah aktif');ui.modal={type:'pkStart'};render()};
  window.pkEndDialog=()=>{if(!pkCanCash())return pkWarn('Akses kasir tidak diberikan');if(!pkActive())return pkWarn('Belum ada shift aktif');ui.modal={type:'pkEnd'};render()};
  window.pkStart=()=>{if(!pkCanCash()||pkActive())return pkWarn('Shift tidak dapat dibuka');const amount=pkNumber('pk-opening');if(!pkValidMoney(amount))return pkWarn('Opening cash tidak valid');let s={id:uid('shift'),tenant:ui.tenant,outlet:pkCurrentOutlet(),cashier:ui.role,opening:amount,note:pkText('pk-open-note'),startedAt:now(),status:'OPEN'};db.posShiftOpen[pkKey()]=s;ui.shiftOpen=true;ui.modal=null;ui.posCart=[];ui.pkSelectedMember='';pkNoteEvent('Buka shift '+s.id+' · '+pkMoney(amount));pkSave();toast('Shift berhasil dibuka')};
  window.pkEnd=()=>{const s=pkShift();if(!pkCanCash()||!s)return pkWarn('Shift tidak aktif');if(ui.posCart.length)return pkWarn('Kosongkan atau tahan keranjang sebelum tutup shift');const counted=pkNumber('pk-counted'),note=pkText('pk-close-note');if(!pkValidMoney(counted))return pkWarn('Uang fisik tidak valid');const diff=counted-pkExpected();if(diff!==0 && note.length<5)return pkWarn('Catatan minimal 5 karakter wajib bila kas selisih');const h={...s,status:'CLOSED',closedAt:now(),cashSales:pkSales(),cashIn:pkEvents().filter(e=>e.type==='IN').reduce((a,e)=>a+e.amount,0),cashOut:pkEvents().filter(e=>e.type==='OUT').reduce((a,e)=>a+e.amount,0),cashRefund:pkRefundCash(),expected:pkExpected(),counted,difference:diff,closeNote:note,varianceReview:diff!==0?'NEEDS_REVIEW':'BALANCED'};db.posShiftHistory.push(h);delete db.posShiftOpen[pkKey()];ui.shiftOpen=false;ui.modal=null;pkNoteEvent('Tutup shift '+h.id+' · selisih '+pkMoney(diff));pkSave();toast('Shift ditutup, selisih '+pkMoney(diff))};
  window.pkCashDialog=(type)=>{if(!pkCanCash()||!pkActive())return pkWarn('Buka shift terlebih dahulu');if(!['IN','OUT'].includes(type))return;ui.modal={type:'pkCash',cashType:type};render()};
  window.pkCashSave=()=>{if(!pkCanCash()||!pkActive())return pkWarn('Shift tidak aktif');const amount=pkNumber('pk-cash-amount'),reason=pkText('pk-cash-reason'),type=ui.modal.cashType;if(!pkValidMoney(amount)||!amount||reason.length<5)return pkWarn('Nominal positif dan alasan minimal 5 karakter wajib');if(type==='OUT'&&amount>pkExpected())return pkWarn('Cash out melebihi kas seharusnya');db.posCashEvents.push({id:uid('cash'),tenant:ui.tenant,shiftId:pkShift().id,outlet:pkCurrentOutlet(),type,amount,reason,actor:ui.role,at:now()});ui.modal=null;pkNoteEvent((type==='IN'?'Cash in':'Cash out')+' '+pkMoney(amount));pkSave();toast('Mutasi kas tercatat')};
  window.pkVariance=()=>{const el=document.getElementById('pk-variance');if(el)el.innerText='Selisih: '+pkMoney(pkNumber('pk-counted')-pkExpected())};
  window.pkHold=()=>{if(!pkActive()||!pkCanCash())return pkWarn('Shift belum aktif');if(!ui.posCart.length)return pkWarn('Keranjang masih kosong');const note=prompt('Nama transaksi yang ditahan (mis. Meja A1 / Pelanggan Budi):','Pesanan sementara');if(note===null)return;const hold={id:uid('hold'),tenant:ui.tenant,outlet:pkCurrentOutlet(),shiftId:pkShift().id,name:note.trim()||'Pesanan sementara',items:JSON.parse(JSON.stringify(ui.posCart)),memberId:ui.pkSelectedMember||null,at:now(),state:'HELD'};db.posHeldCarts.push(hold);ui.posCart=[];ui.pkSelectedMember='';pkSave();toast('Keranjang disimpan sebagai hold')};
  window.pkResume=(id)=>{const h=db.posHeldCarts.find(x=>x.id===id&&x.tenant===ui.tenant&&x.outlet===pkCurrentOutlet()&&x.state==='HELD');if(!h||!pkActive())return pkWarn('Shift tidak aktif atau hold tidak ditemukan');if(ui.posCart.length)return pkWarn('Selesaikan/hold keranjang aktif lebih dahulu');if(h.items.some(i=>{const l=d22Item(i.id,i.variantId||null);return !l||e22Available(i.id,i.variantId||null)<i.qty}))return pkWarn('Stok SKU pada hold tidak tersedia; perlu ditinjau ulang');ui.posCart=h.items;ui.pkSelectedMember=h.memberId||'';h.state='RESUMED';save();navigate('pos');toast('Keranjang dipulihkan, stok divalidasi ulang')};
  window.pkSelectMember=(id)=>{ui.pkSelectedMember=id||'';render()};
  window.pkMemberNewDialog=()=>{if(!rolesMember.includes(ui.role))return pkWarn('Akses ditolak');ui.modal={type:'pkMemberNew'};render()};
  window.pkMemberNew=()=>{if(!rolesMember.includes(ui.role))return pkWarn('Akses ditolak');const name=pkText('pk-member-name'),phone=pkText('pk-member-phone').replace(/[^0-9]/g,''),consent=document.getElementById('pk-member-consent')?.checked||false;if(name.length<2||!/^[0-9]{9,15}$/.test(phone)||!consent)return pkWarn('Isi nama, telepon valid dan persetujuan membership');if(pkOwned().some(x=>x.phone===phone))return pkWarn('Nomor telepon sudah terdaftar untuk tenant ini');let m={id:uid('member'),tenant:ui.tenant,name,phone,email:pkText('pk-member-email'),status:'ACTIVE',consent,joined:now(),lifetimeSpend:0};db.memberAccounts.push(m);ui.pkSelectedMember=m.id;ui.modal=null;pkSave();toast('Member berhasil ditambahkan')};
  window.pkMemberPolicySave=()=>{if(!pkCanManage())return pkWarn('Hanya Owner / Manager');const earn=pkNumber('pk-policy-earn'),value=pkNumber('pk-policy-value'),cap=pkNumber('pk-policy-cap');if(!Number.isSafeInteger(earn)||earn<1000||!Number.isSafeInteger(value)||value<1||value>10000||!Number.isSafeInteger(cap)||cap<1||cap>50)return pkWarn('Aturan poin tidak valid');db.memberSettings[ui.tenant]={enabled:!!document.getElementById('pk-policy-on')?.checked,earnUnit:earn,redeemValue:value,maxPercent:cap};pkSave();toast('Aturan loyalty disimpan')};

'Subscription',"navigate('n22-billing')",'outline')}${button('Modules & quotas',"navigate('n22-entitlements')",'outline')}${button('Device health',"navigate('n22-fleet')",'outline')}${isPlatform()?button('Request lifecycle change',`n22.modal('status',{tenantId:'${t.id}'})`,'danger'):''}`);}

function modalForm(){const m=ui.modal,typ=m.form,t=tid(m.tenantId),plans=P.plans;const field=(id,label,val='',type='text',attr='')=>`<label class="n22-field">${label}<input class="input" id="n22-${id}" type="${type}" value="${safe(val)}" ${attr}></label>`;const select=(id,label,values,val)=>`<label class="n22-field">${label}<select class="input" id="n22-${id}">${values.map(([k,v])=>`<option value="${safe(k)}" ${k===val?'selected':''}>${safe(v)}</option>`).join('')}</select></label>`;let title='Platform Action',body='',fn='n22.submit()',submit='Confirm';if(typ==='createTenant'){title='Create demo tenant';body=field('name','Organization name')+field('brand','Brand')+field('slug','Workspace slug','','text','placeholder="unique-workspace"')+select('plan','Initial plan',plans.map(x=>[x.id,x.id]),'Starter');submit='Create workspace';}else if(typ==='status'){title='Tenant lifecycle request';body=`<p class="n22-modal-intro">${safe(t?.brand)} · ${pill(t?.status||'N/A')}</p>`+select('action','Requested state',[['SUSPENDED','Suspend access'],['ACTIVE','Reactivate tenant']],t?.status==='SUSPENDED'?'ACTIVE':'SUSPENDED')+field('reason','Business reason','','text','placeholder="Required justification"')+field('confirm','Type workspace slug to confirm','','text',`placeholder="${safe(t?.slug||'')}"`)+minor('Creates a pending approval. A different simulated admin must approve before the tenant state changes.');submit='Request approval';}else if(typ==='plan'){const p=plan(m.id);title='Edit '+p.id+' plan';body=field('price','Monthly price (Rp)',p.price,'number','min="0"')+field('outlets','Max outlets',p.outlets,'number','min="1"')+field('staff','Max staff',p.staff,'number','min="1"')+field('registers','Max POS registers',p.registers,'number','min="1"')+field('ai','Monthly AI credits',p.ai,'number','min="0"');submit='Save plan';}else if(typ==='invoice'){title='Create invoice (demo)';body=select('tenant','Tenant',db.tenants.map(t=>[t.id,t.brand]),db.tenants[0]?.id)+field('amount','Amount (Rp)',399000,'number','min="0"')+select('status','Starting status',[['UNPAID','Unpaid'],['FAILED','Failed']], 'UNPAID');submit='Create invoice';}else if(typ==='quota'){title='Edit quota · '+m.key;body=`<div class="n22-modal-intro">${safe(tname(m.tenantId))}</div>`+field('value','Maximum allowed',quota(m.tenantId,m.key),'number','min="0"');submit='Save quota';}else if(typ==='provider'){const p=P.providers.find(x=>x.id===m.id);title='Provider configuration';body=`<div class="n22-modal-intro"><b>${safe(p?.name)}</b><p>${safe(p?.category)} · Configuration state (not live authentication)</p></div>`+select('status','Mock connection state',['CONFIGURED','DISABLED','DEGRADED','EXPERIMENTAL','REVIEW_REQUIRED'].map(x=>[x,x]),p.status)+minor('Provider secrets are never entered or shown in this frontend demo. Official API approval / policy checks required.');submit='Save state';}else if(typ==='device'){const d=P.devices.find(x=>x.id===m.id);title='Offline POS device';body=`<div class="n22-modal-intro"><b>${safe(d?.name)}</b><p>${safe(tname(d?.tenant))} · ${safe(d?.lastSeen)}</p></div>`+select('action','Device operation',[['RETRY','Simulate sync retry'],['RESOLVE','Resolve conflict (demo)'],['REVOKE','Revoke authorization']], 'RETRY')+minor('Revoke is recorded centrally. An offline device only observes it upon reconnect or local authorization expiry.');submit='Apply operation';}else if(typ==='ticket'){const x=P.tickets.find(x=>x.id===m.id);title='Manage support ticket';body=`<div class="n22-modal-intro">${safe(x?.subject)}</div>`+select('status','Status',['OPEN','IN_PROGRESS','WAITING_CUSTOMER','RESOLVED','CLOSED'].map(x=>[x,x]),x.status)+field('owner','Assigned agent',x.owner)+select('priority','Priority',['LOW','NORMAL','HIGH','CRITICAL'].map(x=>[x,x]),x.priority);submit='Update ticket';}else if(typ==='ticketCreate'){title='Create support ticket';body=select('tenant','Tenant',db.tenants.map(t=>[t.id,t.brand]),db.tenants[0]?.id)+field('subject','Issue summary')+select('priority','Priority',['LOW','NORMAL','HIGH','CRITICAL'].map(x=>[x,x]),'NORMAL');submit='Create case';}else if(typ==='grant'){title='Request restricted support access';body=select('tenant','Tenant',db.tenants.map(t=>[t.id,t.brand]),db.tenants[0]?.id)+field('reason','Justification','','text','placeholder="Required incident / ticket reason"')+select('minutes','Time limit',[['15','15 minutes'],['30','30 minutes'],['60','60 minutes']],'30')+minor('Approval by a different admin is required. No transcript, integration secrets, or customer PII are exposed by this UI.');submit='Submit approval request';}else if(typ==='incident'){title='Inject synthetic incident';body=select('service','Service',P.services.map(x=>[x.name,x.name]),P.services[0].name)+select('severity','Severity',['LOW','MEDIUM','HIGH','CRITICAL'].map(x=>[x,x]),'MEDIUM')+field('reason','Summary','Simulated worker latency');submit='Create incident';}else if(typ==='domain'){title='Add custom domain (demo)';body=select('tenant','Tenant',db.tenants.map(t=>[t.id,t.brand]),db.tenants[0]?.id)+field('name','Domain','store.example.com');submit='Save pending domain';}else return '';

function submit(){const m=ui.modal;const type=m?.form;if(!type)return;let text='Action complete';if(['status','plan','createTenant','invoice','quota','provider','device','incident','domain'].includes(type)&&!can())return;

function assign(id,courierId){if(!canDispatch())return err('Role tidak berhak menugaskan kurir.');const o=orderById(id),c=tc().find(c=>c.id===courierId);if(!eligible(o,c))return err('Order/kurir tidak memenuhi syarat READY, ONLINE, outlet, atau kapasitas.');let m=meta(o);m.version=(m.version||0)+1;m.assignedAt=now();m.offerExpiresAt=due(m.assignedAt,O.settings.assignmentMinutes);m.deliveryDueAt=due(m.assignedAt,O.settings.deliveryMinutes);m.pickupChecklist=[];o.courier=c.id;o.delivery='ASSIGNED';audit(o,'ASSIGNED',`Ke ${c.name}; versi ${m.version}`);render();toast('Order ditugaskan kepada '+c.name);return true}
function courierAction(id,action,info={}){
 if(!canCourier())return err('Hanya kurir yang dapat menjalankan aksi ini.');const o=orderById(id),c=me();if(!allowedTenant(o)||!c||o.courier!==c.id)return err('Tugas bukan milik kurir ini.');const m=meta(o);
 if(action==='ACCEPT'&&o.delivery==='ASSIGNED') {if(Date.now()>Date.parse(m.offerExpiresAt||0))return err('Assignment sudah melewati batas respons.');o.delivery='ACCEPTED';m.acceptedAt=now();}
 else if(action==='REJECT'&&o.delivery==='ASSIGNED') {if(!info.reason||info.reason.length<5)return err('Alasan penolakan minimal 5 karakter.');m.rejectedCourier=c.id;m.rejectReason=limitString(info.reason,200);o.courier=null;o.delivery='READY_FOR_ASSIGNMENT';m.version++;}
 else if(action==='PICKUP'&&o.delivery==='ACCEPTED') {const boxes=['order','quantity','packaging','pickup'];if(boxes.some(s=>!info.checks?.includes(s)))return err('Checklist pickup wajib lengkap.');m.pickupChecklist=info.checks;m.pickedUpAt=now();o.delivery='PICKED_UP';}
 else if(action==='START'&&o.delivery==='PICKED_UP') {o.delivery='IN_TRANSIT';m.transitAt=now();}
 else if(action==='ARRIVE'&&o.delivery==='IN_TRANSIT') {o.delivery='ARRIVED';m.arrivedAt=now();}
 else if(action==='RETURN_HANDOFF'&&o.delivery==='RETURN_TO_STORE'){if(m.returnHandedOffAt)return err('Serah terima sudah dicatat.');m.returnHandedOffAt=now();}
 else if(action==='FAIL'&&['IN_TRANSIT','ARRIVED'].includes(o.delivery)) {if(!info.reason||info.reason.length<5)return err('Alasan gagal minimal 5 karakter.');m.attempts=(m.attempts||0)+1;m.exceptions.push({type:'DELIVERY_FAILED',reason:limitString(info.reason,200),at:now(),courier:c.id});o.delivery='DELIVERY_FAILED';m.failedAt=now();}

function reassign(id,courierId,reason){if(!canDispatch())return err('Akses dispatcher diperlukan.');const o=orderById(id),c=tc().find(x=>x.id===courierId);if(!allowedTenant(o)||!active.includes(o.delivery))return err('Hanya pengiriman aktif yang dapat dialihkan.');if(!reason||reason.trim().length<5)return err('Alasan reassign minimal 5 karakter.');if(!c||c.tenant!==ui.tenant||c.status!=='ONLINE'||c.id===o.courier||outletOf(o)!==courierOutlet(c)||activeCount(c.id)>=(c.maxActive||O.settings.maxActive))return err('Kurir pengganti tidak memenuhi syarat.');if(['PICKED_UP','IN_TRANSIT','ARRIVED'].includes(o.delivery))return err('Barang sudah dibawa; gunakan exception & handover terverifikasi, bukan reassign langsung.');const m=meta(o),old=o.courier;m.version++;m.assignedAt=now();m.offerExpiresAt=due(m.assignedAt,O.settings.assignmentMinutes);m.pickupChecklist=[];o.courier=c.id;o.delivery='ASSIGNED';audit(o,'REASSIGNED',`Dari ${old||'-'} ke ${c.name}: ${limitString(reason,200)}`);render();toast('Reassignment berhasil');return true;}
function exceptionAction(id,decision,reason){if(!canDispatch())return err('Akses dispatcher diperlukan.');const o=orderById(id),m=o&&meta(o);if(!allowedTenant(o)||o.delivery!=='DELIVERY_FAILED')return err('Order tidak berada di antrean exception.');if(!reason||reason.trim().length<5)return err('Isi keputusan/alasan minimal 5 karakter.');if(decision==='RETRY'){if((m.attempts||0)>=3)return err('Maksimum tiga percobaan; arahkan ke retur.');o.delivery='RETRY_PENDING';}
